<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안전한더유스 · 통합 관리자 허브</title>
<style>
  :root {
    --bg: #FDF6EA; --surface: #FFFDF8; --ink: #241508; --muted: #6B5540; --line: #EAD9BE; --accent: #2C6765;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Apple SD Gothic Neo","Malgun Gothic",sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
  header b { font-size: 15px; }
  #tabs { display: none; align-items: center; gap: 6px; padding: 8px 16px 0; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
  #tabs button { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px 8px 0 0; border: 1px solid var(--line); border-bottom: none; background: var(--bg); color: var(--muted); cursor: pointer; }
  #tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #refreshBtn { margin-left: auto; } #refreshBtn ~ #resetBtn { margin-left: 0; }
  #resetBtn { margin-left: auto; background: transparent !important; border: none !important; color: var(--muted); font-size: 12px; font-weight: 400 !important; padding: 8px 4px !important; }
  #frames { display: none; flex: 1; position: relative; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
  #frames iframe.on { display: block; }
  #bizBox { display: none; position: fixed; top: 56px; right: 16px; z-index: 10; width: 300px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.12); font-size: 13px; }
  #bizBox ul { margin: 8px 0; padding-left: 18px; } #bizBox input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font: inherit; box-sizing: border-box; }
  #bizBox button { margin-top: 8px; padding: 7px 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #bizBox .close { background: transparent; color: var(--muted); float: right; margin: -6px -6px 0 0; }
  #setup { display: none; max-width: 440px; margin: 48px auto; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  #setup .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
  #setup label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; }
  #setup input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  #setup button { margin-top: 16px; padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header><b>안전한더유스 · 통합 관리자 허브</b></header>

<div id="setup">
  <div class="hint">최초 1회만 각 시스템의 토큰(기존 관리자 링크에서 <code>t=</code> 뒤의 값)을 입력해 주세요. 이 브라우저에 저장되어, 다음부터는 이 페이지 주소(<code>hub.html</code>)만으로 바로 열립니다.</div>
  <label>나의 마음살피기 토큰</label>
  <input id="t-maeum" placeholder="기존 admin.html 링크의 t= 뒤 값">
  <label>인력풀 관리 토큰</label>
  <input id="t-recruit" placeholder="기존 recruit/admin.html 링크의 t= 뒤 값">
  <label>위드워킹 보고서 토큰</label>
  <input id="t-withwalking" placeholder="기존 withwalking/admin.html 링크의 t= 뒤 값">
  <label>자기주도 일경험 토큰</label>
  <input id="t-ilgyeongheom" placeholder="일경험 시트 메뉴 [일경험 관리 → 관리자 대시보드 링크 보기]의 t= 뒤 값">
  <button id="saveBtn">저장하고 열기</button>
  <button id="cancelBtn" style="display:none;background:transparent;color:var(--muted);box-shadow:none;">취소</button>
</div>

<div id="tabs"></div>
<div id="bizBox">
  <button class="close" id="bizClose">✕</button>
  <b>사업 관리</b>
  <p style="color:var(--muted);margin:6px 0 0">여기서 추가한 사업은 모든 탭의 사업 목록에 함께 나와요.</p>
  <ul id="bizItems"><li>불러오는 중…</li></ul>
  <input id="bizName" placeholder="새 사업 이름 (예: 노원구)" maxlength="30">
  <button id="bizAdd">사업 추가</button>
  <p id="bizMsg" style="color:var(--muted);margin:6px 0 0"></p>
</div>
<div id="frames"></div>

<script>
(function () {
  var CONF = {
    maeum: { label: '나의 마음살피기', path: 'admin.html' },
    recruit: { label: '활동가(코치) 신청', path: 'recruit/admin.html' },
    withwalking: { label: '위드워킹 보고서', path: 'withwalking/admin.html' },
    ilgyeongheom: { label: '자기주도 일경험', path: 'ilgyeongheom/admin.html' },
    // 바로가기 탭: 위드워킹 관리자 화면을 미래내일일경험으로 걸러 요약부터 보여줘요(토큰은 위드워킹 것을 같이 씀)
    mirae: { label: '미래내일일경험', path: 'withwalking/admin.html?biz=' + encodeURIComponent('미래내일일경험'), tokenOf: 'withwalking' }
  };
  var keys = Object.keys(CONF);
  var tokenKeys = keys.filter(function (k) { return !CONF[k].tokenOf; }); // 토큰 입력칸이 있는 탭만(바로가기 탭 제외)
  var qs = new URLSearchParams(location.search);
  var tokens = {};

  // 1) 쿼리로 들어온 토큰은 이 브라우저에 저장해 둠(다음부터는 짧은 주소로 접근 가능)
  tokenKeys.forEach(function (k) {
    var v = qs.get(k);
    if (v) localStorage.setItem('hub_t_' + k, v);
  });

  // 2) 저장된 값 기준으로 모읍니다
  tokenKeys.forEach(function (k) {
    var v = localStorage.getItem('hub_t_' + k);
    if (v) tokens[k] = v;
  });

  var missing = tokenKeys.filter(function (k) { return !tokens[k]; });
  if (missing.length) {
    showSetup();
  } else {
    renderTabs();
  }

  function showSetup() {
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('frames').style.display = 'none';
    document.getElementById('setup').style.display = 'block';

    // 기존에 저장된 값이 있으면 미리 채워둬서, 틀린 것 하나만 고치면 되게 함
    var hasAll = true;
    tokenKeys.forEach(function (k) {
      var el = document.getElementById('t-' + k);
      var cur = localStorage.getItem('hub_t_' + k);
      if (cur) el.value = cur; else hasAll = false;
    });

    var cancelBtn = document.getElementById('cancelBtn');
    cancelBtn.style.display = hasAll ? 'inline-block' : 'none';
    cancelBtn.onclick = function () { location.href = location.pathname; };

    document.getElementById('saveBtn').onclick = function () {
      tokenKeys.forEach(function (k) {
        var el = document.getElementById('t-' + k);
        var v = el && el.value.trim();
        // 링크 전체(…admin.html?t=값)를 붙여넣어도 t= 뒤의 값만 꺼내 저장해요
        var m = v && v.match(/[?&]t=([^&#\s]+)/);
        if (m) v = decodeURIComponent(m[1]);
        if (v) localStorage.setItem('hub_t_' + k, v);
      });
      location.href = location.pathname;
    };
  }

  function renderTabs() {
    var tabsEl = document.getElementById('tabs');
    var framesEl = document.getElementById('frames');
    tabsEl.style.display = 'flex';
    framesEl.style.display = 'block';

    keys.forEach(function (k, i) {
      var btn = document.createElement('button');
      btn.textContent = CONF[k].label;
      btn.dataset.k = k;
      if (i === 0) btn.className = 'on';
      btn.onclick = function () { selectTab(k); };
      tabsEl.appendChild(btn);

      var f = document.createElement('iframe');
      f.id = 'frame-' + k;
      if (i === 0) f.className = 'on';
      framesEl.appendChild(f);
    });

    // 2026-11-24: 시트에서 바꾼 내용이 바로 보이게, 지금 탭을 다시 불러오는 버튼
    var refresh = document.createElement('button');
    refresh.id = 'refreshBtn';
    refresh.textContent = '↻ 새로고침';
    refresh.onclick = function () { var on = document.querySelector('#tabs button.on'); if (on) selectTab(on.dataset.k); };
    tabsEl.appendChild(refresh);

    // 2026-11-24: 사업 관리 — 목록은 마음살피기 시트 [사업목록] 탭에 저장돼요(마음살피기 토큰으로 추가)
    var bizBtn = document.createElement('button');
    bizBtn.id = 'bizBtn';
    bizBtn.textContent = '사업 관리';
    bizBtn.onclick = openBiz;
    tabsEl.appendChild(bizBtn);

    var reset = document.createElement('button');
    reset.id = 'resetBtn';
    reset.textContent = '토큰 수정';
    reset.onclick = function () { showSetup(); };
    tabsEl.appendChild(reset);

    selectTab(keys[0]);
  }

  var MAEUM_URL = 'https://script.google.com/macros/s/AKfycbzOUjsXCYytuhh8kJXmVxfor49VkKj4Nhj3Ri8bbFmfqF4duVmuR2dofbyj_V8Y7BYb-Q/exec';
  function showBizList(list) {
    document.getElementById('bizItems').innerHTML = list.map(function (b) { return '<li>' + b.replace(/[&<>"]/g, '') + '</li>'; }).join('');
  }
  function openBiz() {
    var box = document.getElementById('bizBox');
    box.style.display = 'block';
    document.getElementById('bizMsg').textContent = '';
    fetch(MAEUM_URL + '?action=bizList').then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) showBizList(j.list); else document.getElementById('bizItems').innerHTML = '<li>목록을 못 불러왔어요</li>';
    }).catch(function () { document.getElementById('bizItems').innerHTML = '<li>목록을 못 불러왔어요</li>'; });
    document.getElementById('bizClose').onclick = function () { box.style.display = 'none'; };
    document.getElementById('bizAdd').onclick = function () {
      var name = document.getElementById('bizName').value.trim();
      var msg = document.getElementById('bizMsg');
      if (!name) { msg.textContent = '사업 이름을 적어 주세요.'; return; }
      if (!confirm('"' + name + '" 사업을 추가할까요? 추가한 뒤에는 시트의 [사업목록] 탭에서만 지울 수 있어요.')) return;
      msg.textContent = '추가하는 중…';
      fetch(MAEUM_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'adminAddBiz', token: tokens.maeum, name: name }) })
        .then(function (r) { return r.json(); }).then(function (j) {
          if (!j.ok) { msg.textContent = j.error === 'duplicate' ? '이미 있는 사업이에요.' : j.error === 'bad_name' ? '이름은 30자 이내, 쉼표 없이 적어 주세요.' : '추가하지 못했어요: ' + j.error; return; }
          showBizList(j.list);
          document.getElementById('bizName').value = '';
          msg.textContent = '추가했어요. 지금 탭을 새로 불러올게요.';
          var on = document.querySelector('#tabs button.on'); if (on) selectTab(on.dataset.k);
        }).catch(function () { msg.textContent = '추가하지 못했어요. 잠시 뒤 다시 해주세요.'; });
    };
  }

  function selectTab(k) {
    document.querySelectorAll('#tabs button[data-k]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.k === k);
    });
    document.querySelectorAll('#frames iframe').forEach(function (f) {
      f.classList.toggle('on', f.id === 'frame-' + k);
    });
    var f = document.getElementById('frame-' + k);
    var tok = tokens[CONF[k].tokenOf || k];
    // 탭을 누를 때마다 새로 불러와요(예전엔 처음 한 번만 불러와서 시트에서 바꾼 내용이 안 보였음)
    f.src = CONF[k].path + (CONF[k].path.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(tok);
  }
})();
</script>
</body>
</html>
