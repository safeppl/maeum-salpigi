<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>행정 관리 대시보드</title>
<style>
  :root { --muted: #666; --line: #ddd; --on: #1b5e20; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Noto Sans KR', sans-serif; color: #222; background: #fff; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  header b { margin-right: auto; }
  button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: #fafafa; cursor: pointer; }
  button.on { background: var(--on); color: #fff; border-color: var(--on); }
  #setup { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  #근태 { height: calc(100% - 52px); }
  #근태 .확인 { margin: 0; padding: 4px 16px; }
  #근태화면 { width: 100%; height: calc(100% - 28px); border: 0; }
  #setup input { width: 100%; font: inherit; padding: 8px; margin: 6px 0 12px; }
  .확인 { color: var(--muted); font-size: 14px; }
  #frame { width: 100%; height: calc(100% - 52px); border: 0; display: none; }
  .큰버튼 { display: inline-block; margin-top: 12px; padding: 12px 20px; background: var(--on); color: #fff; border-radius: 8px; text-decoration: none; }
</style>
</head>
<body>
<!--
  2026-11-24: 품의·지출결의서 앱과 근태관리 앱 '둘만' 묶은 행정 관리자용 페이지(서비스 사업 통합 허브와 분리 — 사용자 지정).
  열쇠(품의 사무국장 전용 링크)는 이 브라우저에만 저장(office_ 키, 허브와 다른 키). 근태관리는 키오스크 관리자 화면(비밀번호 필요)을 이 페이지 안에 띄운다(2026-11-25 사용자 요청 — 새 탭 전환이 불편. 근태 Code.gs doGet에 XFrameOptions ALLOWALL 필요).
-->
<header>
  <b>행정 관리 대시보드</b>
  <button id="탭품의" hidden>품의·지출결의</button>
  <button id="탭근태" hidden>근태관리</button>
  <button id="열쇠수정" hidden>열쇠 수정</button>
</header>

<div id="setup" hidden>
  <p>처음 한 번만 <b>품의·지출결의 사무국장 전용 링크</b>를 넣어 주세요. 이 브라우저에만 저장되고, 다음부터는 이 주소만으로 열립니다.</p>
  <input id="열쇠칸" placeholder="https://safeppl.github.io/maeum-salpigi/pumui/?t=… (링크 통째로 붙여넣어도 됩니다)">
  <button id="저장">저장하고 열기</button>
  <p class="확인">공용 PC라면 쓰신 뒤 [열쇠 수정] → 칸을 비우고 저장해 지워 주세요.</p>
</div>

<div id="근태" hidden>
  <p class="확인">관리자 비밀번호를 넣고 쓰세요. 화면이 안 뜨면 <a href="https://script.google.com/macros/s/AKfycbz9MX4AIoadvdGZ2zbO5dXZpHOTAPme7UZNYAGdyVLBxcyVyAbzA41lpKzLdt59CTE/exec?page=admin" target="_blank" rel="noopener">새 탭으로 열기 ↗</a></p>
  <iframe id="근태화면" title="근태관리"></iframe>
</div>

<iframe id="frame" title="품의·지출결의"></iframe>

<script>
  const 키 = 'office_t_pumui';
  const 읽기 = () => { try { return localStorage.getItem(키) || ''; } catch (e) { return ''; } };
  const 쓰기 = (v) => { try { v ? localStorage.setItem(키, v) : localStorage.removeItem(키); } catch (e) { /* 저장 불가 브라우저 */ } };
  const 보임 = (id, 켬) => { document.getElementById(id).hidden = !켬; };

  function 설정보이기() {
    보임('setup', true); 보임('근태', false); 보임('탭품의', false); 보임('탭근태', false); 보임('열쇠수정', false);
    document.getElementById('frame').style.display = 'none';
    document.getElementById('열쇠칸').value = 읽기();
  }

  function 탭(이름) {
    document.getElementById('탭품의').classList.toggle('on', 이름 === '품의');
    document.getElementById('탭근태').classList.toggle('on', 이름 === '근태');
    보임('근태', 이름 === '근태');
    const 근태 = document.getElementById('근태화면');
    // 처음 열 때만 불러온다 — 탭을 오가도 비밀번호를 다시 넣지 않게
    if (이름 === '근태' && !근태.src) 근태.src = 'https://script.google.com/macros/s/AKfycbz9MX4AIoadvdGZ2zbO5dXZpHOTAPme7UZNYAGdyVLBxcyVyAbzA41lpKzLdt59CTE/exec?page=admin';
    const f = document.getElementById('frame');
    f.style.display = 이름 === '품의' ? 'block' : 'none';
    if (이름 === '품의') f.src = '../pumui/index.html?t=' + encodeURIComponent(읽기()); // 누를 때마다 새로 불러옴
  }

  function 시작() {
    if (!읽기()) return 설정보이기();
    보임('setup', false); 보임('탭품의', true); 보임('탭근태', true); 보임('열쇠수정', true);
    탭('품의');
  }

  document.getElementById('저장').onclick = () => {
    let v = document.getElementById('열쇠칸').value.trim();
    const m = v.match(/[?&]t=([^&#\s]+)/); // 링크를 통째로 넣어도 t= 값만
    if (m) v = decodeURIComponent(m[1]);
    쓰기(v);
    시작();
  };
  document.getElementById('탭품의').onclick = () => 탭('품의');
  document.getElementById('탭근태').onclick = () => 탭('근태');
  document.getElementById('열쇠수정').onclick = 설정보이기;
  시작();
</script>
</body>
</html>
