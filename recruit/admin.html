<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>인력풀 관리자 화면</title>
<style>
  :root { --teal:#2C6765; --orange:#D68B47; --bg:#EDF1EC; --surface:#fff; --text:#1E2A2B; --muted:#5A6968; --border:#D2DAD3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Apple SD Gothic Neo","Malgun Gothic",sans-serif; background: var(--bg); color: var(--text); }
  #app { display: flex; min-height: 100vh; }
  #side { width: 280px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #side header { padding: 14px; border-bottom: 1px solid var(--border); }
  #side header b { font-size: 15px; } #side header span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  #search { margin: 10px 12px 6px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 12.5px; }
  #dashBtn { margin: 0 12px 10px; padding: 9px; border: 0; border-radius: 8px; background: var(--teal); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  #list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .p-item { padding: 8px 9px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; font-size: 12.5px; }
  .p-item:hover { background: var(--bg); } .p-item.on { background: var(--teal); color: #fff; }
  .p-meta { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; } .p-item.on .p-meta { color: #D2E4E3; }
  #main { flex: 1; overflow-y: auto; padding: 26px 32px; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; min-width: 110px; }
  .card b { display: block; font-size: 22px; } .card span { font-size: 12px; color: var(--muted); }
  h2 { font-size: 16px; margin: 26px 0 10px; } h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  td, th { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
  th { background: var(--bg); color: var(--teal); font-size: 11.5px; }
  .msg { color: var(--muted); font-size: 13px; padding: 40px; text-align: center; }
  .m { font-size: 12.5px; color: var(--muted); margin: 4px 0; }
  .btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button.act { font: inherit; font-size: 13px; font-weight: 700; padding: 9px 14px; border-radius: 8px; border: 0; cursor: pointer; }
  .coach { background: var(--teal); color: #fff; } .activist { background: var(--orange); color: #1E1508; } .rej { background: var(--bg); color: var(--muted); }
  button.act:disabled { opacity: .45; cursor: default; }
  .linkBox { margin-top: 10px; } .linkBox textarea { width: 100%; height: 90px; font: inherit; font-size: 12.5px; box-sizing: border-box; padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header><b>안전한더유스</b><span>인력풀 관리자 화면</span></header>
    <input id="search" placeholder="이름 검색">
    <button id="dashBtn">대시보드</button>
    <div id="list"></div>
  </div>
  <div id="main"><div class="msg">불러오는 중...</div></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMM5tEf9X_rOPmpwlOg9MOBW6Q1VEICBxd5GJe7SKUQ9WHW7Cx1OVbFuP4phEA9wzs/exec";
const params = new URLSearchParams(location.search);
const TOKEN = params.get("t") || "";
let DATA = null, activeRow = null;

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function callAdmin(action, extra) {
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action: action, token: TOKEN }, extra || {}))
  });
  return res.json();
}

async function fetchData() {
  const res = await fetch(SCRIPT_URL + "?action=adminOverview&token=" + encodeURIComponent(TOKEN));
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "오류");
  DATA = json;
  renderList();
}

async function load() {
  if (!TOKEN) { document.getElementById("main").innerHTML = '<div class="msg">주소 끝에 ?t=관리자토큰 이 빠져 있어요.</div>'; return; }
  try { await fetchData(); renderDashboard(); }
  catch (err) { document.getElementById("main").innerHTML = '<div class="msg">불러오지 못했어요: ' + esc(err.message) + '</div>'; }
}

function renderList() {
  const q = document.getElementById("search").value.trim();
  const rows = DATA.applicants.filter(p => !q || p.name.indexOf(q) >= 0);
  document.getElementById("list").innerHTML = rows.map(p =>
    '<div class="p-item' + (p.rowIndex === activeRow ? " on" : "") + '" data-row="' + p.rowIndex + '">' +
      '<b>' + esc(p.name) + '</b>' +
      '<span class="p-meta">' + esc(p.status) + ' · ' + esc(p.roles.join(", ")) + '</span></div>'
  ).join("") || '<div class="msg">해당하는 신청자가 없어요.</div>';
  document.querySelectorAll(".p-item").forEach(el => el.addEventListener("click", () => {
    activeRow = Number(el.dataset.row); renderList(); renderDetail(DATA.applicants.find(p => p.rowIndex === activeRow));
  }));
}

function renderDashboard() {
  activeRow = null; renderList();
  let h = '<div class="cards">' +
    Object.keys(DATA.byStatus).map(s => '<div class="card"><b>' + DATA.byStatus[s] + '</b><span>' + esc(s) + '</span></div>').join("") +
    '</div>';
  h += '<h2>신청자 (' + DATA.applicants.length + '명)</h2><table><tr><th>이름</th><th>지역</th><th>희망역할</th><th>처리상태</th><th>접수일</th></tr>' +
    DATA.applicants.map(p => '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.sido) + ' ' + esc(p.sigungu) + '</td><td>' + esc(p.roles.join(", ")) + '</td><td>' + esc(p.status) + '</td><td>' + esc(p.appliedAt) + '</td></tr>').join("") +
    '</table>';
  document.getElementById("main").innerHTML = h;
}

function act(rowIndex, action, btn, label) {
  btn.disabled = true; btn.textContent = "처리 중...";
  callAdmin(action, { rowIndex: rowIndex }).then(json => {
    if (!json.ok) { btn.textContent = "실패: " + json.error; btn.disabled = false; return; }
    btn.textContent = label + " 완료";
    fetchData().then(() => renderDetail(DATA.applicants.find(p => p.rowIndex === rowIndex)));
  }).catch(err => { btn.textContent = "실패: " + err.message; btn.disabled = false; });
}

function trainBtn(rowIndex, btn) {
  btn.disabled = true; btn.textContent = "발급 중...";
  callAdmin("adminConfirmTraining", { rowIndex: rowIndex }).then(json => {
    if (!json.ok) { btn.textContent = "실패: " + json.error; btn.disabled = false; return; }
    btn.textContent = "발급 완료";
    const link = "https://safeppl.github.io/maeum-salpigi/recruit/upload.html?t=" + json.token;
    const msg = "[안전한더유스] " + json.name + "님, 양성교육 이수를 축하드려요!\n실전 투입 전에 서류(이력서·자격증·신분증사본·통장사본·계약서) 제출이 필요해요.\n아래 링크에서 업로드해 주세요.\n" + link;
    document.getElementById("linkBox").style.display = "block";
    document.getElementById("linkText").value = msg;
  }).catch(err => { btn.textContent = "실패: " + err.message; btn.disabled = false; });
}

function copyLink() {
  const ta = document.getElementById("linkText"); ta.focus(); ta.select();
  try { document.execCommand("copy"); document.getElementById("copyMsg").textContent = "복사했어요."; }
  catch (e) { document.getElementById("copyMsg").textContent = "직접 선택해 복사해주세요."; }
}

function renderDetail(p) {
  if (!p) return;
  let h = '<p class="m"><b>' + esc(p.name) + ' · ' + esc(p.phone) + '</b> · ' + esc(p.status) + '</p>';
  h += '<p class="m">' + esc(p.sido) + ' ' + esc(p.sigungu) + ' · ' + esc(p.age) + '세 ' + esc(p.sex) + ' · 소속: ' + esc(p.org || "—") + '</p>';
  h += '<p class="m">희망역할: ' + esc(p.roles.join(", ")) + '</p>';
  h += '<p class="m">활동경력: ' + esc(p.exp || "—") + '</p>';
  h += '<p class="m">참여동기: ' + esc(p.motive || "—") + '</p>';
  if (p.done.length) h += '<p class="m">이미 처리됨: ' + esc(p.done.join(", ")) + '</p>';
  if (p.trainedAt) h += '<p class="m">이수확인일: ' + esc(p.trainedAt) + (p.docSubmittedAt ? " · 서류제출: " + esc(p.docSubmittedAt) : " · 서류 미제출") + '</p>';
  const isComplete = p.showReject && !p.showCoach && !p.showActivist && !p.needsTraining && p.docSubmittedAt;
  if (isComplete) h += '<p class="m" style="color:#2C6765;font-weight:700">✅ 등록 완료 — 희망한 역할 등록, 양성교육 이수확인, 서류 제출까지 모두 끝났어요.</p>';
  h += '<div class="btns">' +
    (p.showCoach ? '<button class="act coach" id="btnCoach">코치로 등록</button>' : '') +
    (p.showActivist ? '<button class="act activist" id="btnActivist">활동가로 등록</button>' : '') +
    (p.showCoach && p.showActivist ? '<button class="act activist" id="btnBoth">코치+활동가 둘 다 등록</button>' : '') +
    (p.showReject ? '<button class="act rej" id="btnReject">반려</button>' : '') +
    (p.needsTraining ? '<button class="act coach" id="btnTrain">이수확인 · 서류 업로드 링크 발급</button>' : '') +
    '</div>';
  h += '<div class="linkBox" id="linkBox" style="display:none"><textarea id="linkText" readonly></textarea>' +
    '<div class="btns"><button class="act rej" id="btnCopy">문구 복사</button><span class="m" id="copyMsg"></span></div></div>';
  document.getElementById("main").innerHTML = h;
  if (p.showCoach) document.getElementById("btnCoach").addEventListener("click", e => act(p.rowIndex, "adminApproveCoach", e.target, "코치 등록"));
  if (p.showActivist) document.getElementById("btnActivist").addEventListener("click", e => act(p.rowIndex, "adminApproveActivist", e.target, "활동가 등록"));
  if (p.showCoach && p.showActivist) document.getElementById("btnBoth").addEventListener("click", e => act(p.rowIndex, "adminApproveBoth", e.target, "코치+활동가 등록"));
  if (p.showReject) document.getElementById("btnReject").addEventListener("click", e => act(p.rowIndex, "adminReject", e.target, "반려"));
  if (p.needsTraining) document.getElementById("btnTrain").addEventListener("click", e => trainBtn(p.rowIndex, e.target));
  document.getElementById("btnCopy") && document.getElementById("btnCopy").addEventListener("click", copyLink);
}

document.getElementById("dashBtn").addEventListener("click", renderDashboard);
document.getElementById("search").addEventListener("input", renderList);
load();
</script>
</body>
</html>
