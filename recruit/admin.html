<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>인력풀 관리자 화면</title>
<style>
  :root { --teal:#2C6765; --orange:#D68B47; --bg:#EDF1EC; --surface:#fff; --text:#1E2A2B; --muted:#5A6968; --border:#D2DAD3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Apple SD Gothic Neo","Malgun Gothic",sans-serif; background: var(--bg); color: var(--text); }
  #app { display: flex; min-height: 100vh; }
  #side { width: 280px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #side header { padding: 14px; border-bottom: 1px solid var(--border); }
  #side header b { font-size: 15px; } #side header span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  #search { margin: 10px 12px 6px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 12.5px; }
  #dashBtn { margin: 0 12px 10px; padding: 9px; border: 0; border-radius: 8px; background: var(--teal); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  #list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .p-item { padding: 8px 9px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; font-size: 12.5px; }
  .p-item:hover { background: var(--bg); } .p-item.on { background: var(--teal); color: #fff; }
  .p-meta { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; } .p-item.on .p-meta { color: #D2E4E3; }
  #main { flex: 1; overflow-y: auto; padding: 26px 32px; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; min-width: 110px; }
  .card b { display: block; font-size: 22px; } .card span { font-size: 12px; color: var(--muted); }
  h2 { font-size: 16px; margin: 26px 0 10px; } h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  td, th { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
  th { background: var(--bg); color: var(--teal); font-size: 11.5px; }
  .msg { color: var(--muted); font-size: 13px; padding: 40px; text-align: center; }
  .m { font-size: 12.5px; color: var(--muted); margin: 4px 0; }
  .btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button.act { font: inherit; font-size: 13px; font-weight: 700; padding: 9px 14px; border-radius: 8px; border: 0; cursor: pointer; }
  .coach { background: var(--teal); color: #fff; } .activist { background: var(--orange); color: #1E1508; } .rej { background: var(--bg); color: var(--muted); }
  button.act:disabled { opacity: .45; cursor: default; }
  .linkBox { margin-top: 10px; } .linkBox textarea { width: 100%; height: 90px; font: inherit; font-size: 12.5px; box-sizing: border-box; padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header><b>안전한더유스</b><span>인력풀 관리자 화면</span></header>
    <input id="search" placeholder="이름 검색">
    <select id="bizFilter" style="margin:0 12px 8px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:12.5px;width:calc(100% - 24px)"></select>
    <button id="dashBtn">대시보드</button>
    <div id="list"></div>
  </div>
  <div id="main"><div class="msg">불러오는 중...</div></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMM5tEf9X_rOPmpwlOg9MOBW6Q1VEICBxd5GJe7SKUQ9WHW7Cx1OVbFuP4phEA9wzs/exec";
const params = new URLSearchParams(location.search);
const TOKEN = params.get("t") || "";
let DATA = null, activeRow = null;
// 2026-11-24: 담당사업(3-2) — 사업 목록은 마음살피기 [사업목록](허브 [사업 관리])을 따라가요
const MAEUM_URL = "https://script.google.com/macros/s/AKfycbzOUjsXCYytuhh8kJXmVxfor49VkKj4Nhj3Ri8bbFmfqF4duVmuR2dofbyj_V8Y7BYb-Q/exec";
const ASSIGN_ROLES = ["동행활동가", "동행코치", "일경험 코치"];
let BIZ_ALL = ["도봉구", "용인시", "미래내일일경험", "갭이어"];
function renderBizFilter() {
  const sel = document.getElementById("bizFilter"), cur = sel.value;
  sel.innerHTML = '<option value="">전체 사업</option>' + BIZ_ALL.map(b => '<option value="' + esc(b) + '"' + (b === cur ? " selected" : "") + '>' + esc(b) + '</option>').join("");
}
const assignText = p => (p.assignments || []).map(a => a.biz + "(" + a.role + ")").join(", ");
fetch(MAEUM_URL + "?action=bizList").then(r => r.json()).then(j => { if (j.ok && j.list.length) { BIZ_ALL = j.list; renderBizFilter(); } }).catch(() => {});

// 2026-11-23: 시트에 저장되는 값(코치/활동가)은 그대로 두고 화면에서만 정식 명칭으로 보여줘요
const ROLE_NAME = { "코치": "일경험 코치", "활동가": "동행활동가" };
const roleNames = rs => rs.map(r => ROLE_NAME[r] || r).join(", ");
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function callAdmin(action, extra) {
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action: action, token: TOKEN }, extra || {}))
  });
  return res.json();
}

async function fetchData() {
  const res = await fetch(SCRIPT_URL + "?action=adminOverview&token=" + encodeURIComponent(TOKEN));
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "오류");
  DATA = json;
  renderList();
}

async function load() {
  if (!TOKEN) { document.getElementById("main").innerHTML = '<div class="msg">주소 끝에 ?t=관리자토큰 이 빠져 있어요.</div>'; return; }
  try { await fetchData(); renderDashboard(); }
  catch (err) { document.getElementById("main").innerHTML = '<div class="msg">불러오지 못했어요: ' + esc(err.message) + '</div>'; }
}

function renderList() {
  const q = document.getElementById("search").value.trim();
  const biz = document.getElementById("bizFilter").value;
  const rows = DATA.applicants.filter(p => (!q || p.name.indexOf(q) >= 0) && (!biz || (p.assignments || []).some(a => a.biz === biz)));
  document.getElementById("list").innerHTML = rows.map(p =>
    '<div class="p-item' + (p.rowIndex === activeRow ? " on" : "") + '" data-row="' + p.rowIndex + '">' +
      '<b>' + esc(p.name) + '</b>' +
      '<span class="p-meta">' + esc(p.status) + ' · ' + esc(roleNames(p.roles)) + (p.assignments && p.assignments.length ? ' · ' + esc(assignText(p)) : '') + '</span></div>'
  ).join("") || '<div class="msg">해당하는 신청자가 없어요.</div>';
  document.querySelectorAll(".p-item").forEach(el => el.addEventListener("click", () => {
    activeRow = Number(el.dataset.row); renderList(); renderDetail(DATA.applicants.find(p => p.rowIndex === activeRow));
  }));
}

// 2026-11-26: 서류 제출 모니터링 — 표에서 상태를 보고 [서류 보기]로 폴더·파일 목록을 바로 열어요
function docStatusHtml(p) {
  const st = p.docSubmittedAt ? (p.docsAcknowledged ? '<span style="color:#2C6765">기존 서류 인정</span>' : '<span style="color:#2C6765;font-weight:700">업로드 ' + esc(p.docSubmittedAt) + '</span>')
    : (p.done && p.done.length && p.showReject ? '<span style="color:#B3261E">미제출</span>' : '<span class="m">—</span>');
  return st + ' <button class="act rej docView" data-row="' + p.rowIndex + '" style="padding:3px 8px;font-size:12px">서류 보기</button>';
}
const DOC_KINDS = [["이력서", "이력서"], ["자격증", "자격증"], ["신분증", "신분증"], ["통장", "통장사본"], ["이수", "이수증"]];
async function showDocs(p, box, btn) {
  if (!p) return;
  box.innerHTML = '<p class="m">' + esc(p.name) + '님 서류를 불러오는 중…</p>';
  if (btn) btn.disabled = true;
  try {
    const j = await callAdmin("adminDocFiles", { rowIndex: p.rowIndex });
    if (!j.ok) throw new Error(j.error || "오류");
    const kinds = DOC_KINDS.map(([stem, label]) => [label, j.files.some(f => f.name.indexOf(stem) >= 0)]);
    let h = '<div style="margin:12px 0;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px"><b>' + esc(p.name) + ' 서류</b>';
    if (!j.folderUrl) h += '<p class="m">드라이브에 이 분의 서류 폴더가 아직 없어요(업로드 전이거나 폴더 이름이 달라요).</p>';
    else {
      h += ' <a href="' + esc(j.folderUrl) + '" target="_blank" rel="noopener">📁 폴더 열기(' + esc(j.folderName) + ')</a>' +
        '<p class="m">' + kinds.map(([l, ok]) => (ok ? "✅ " : "▫️ ") + l).join(" · ") + '</p>' +
        (j.files.length ? '<ul style="margin:6px 0;padding-left:18px">' + j.files.map(f => '<li><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.name) + '</a> <span class="m">' + esc(f.updated) + '</span></li>').join("") + '</ul>' : '<p class="m">폴더 바로 아래에 파일이 없어요.</p>') +
        (j.subfolders.length ? '<p class="m">하위 폴더: ' + j.subfolders.map(d => '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.name) + '</a>').join(", ") + '</p>' : '');
    }
    box.innerHTML = h + '</div>';
  } catch (err) { box.innerHTML = '<p class="m" style="color:#B3261E">서류를 불러오지 못했어요: ' + esc(err.message) + '</p>'; }
  if (btn) btn.disabled = false;
}

function renderDashboard() {
  activeRow = null; renderList();
  let h = '<div class="cards">' +
    Object.keys(DATA.byStatus).map(s => '<div class="card"><b>' + DATA.byStatus[s] + '</b><span>' + esc(s) + '</span></div>').join("") +
    '</div>';
  h += '<h2>신청자 (' + DATA.applicants.length + '명)</h2><table><tr><th>이름</th><th>지역</th><th>희망역할</th><th>처리상태</th><th>담당사업</th><th>서류</th><th>접수일</th><th></th></tr>' +
    DATA.applicants.map(p => '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.sido) + ' ' + esc(p.sigungu) + '</td><td>' + esc(roleNames(p.roles)) + '</td><td>' + esc(p.status) + '</td><td>' + esc(assignText(p) || "—") + '</td><td>' + docStatusHtml(p) + '</td><td>' + esc(p.appliedAt) + '</td>' +
      '<td><button class="act rowDel" data-row="' + p.rowIndex + '" style="background:#B3261E;color:#fff;padding:4px 10px;font-size:12px">🗑 삭제</button></td></tr>').join("") +
    '</table><div id="docPanel"></div>';
  document.getElementById("main").innerHTML = h;
  document.querySelectorAll(".docView").forEach(b => b.addEventListener("click", () => showDocs(DATA.applicants.find(p => p.rowIndex === Number(b.dataset.row)), document.getElementById("docPanel"), b)));
  document.querySelectorAll(".rowDel").forEach(b => b.addEventListener("click", () => deleteApplicant(DATA.applicants.find(p => p.rowIndex === Number(b.dataset.row)), b)));
}

function act(rowIndex, action, btn, label, extra) {
  btn.disabled = true; btn.textContent = "처리 중...";
  callAdmin(action, Object.assign({ rowIndex: rowIndex }, extra || {})).then(json => {
    if (!json.ok) { btn.textContent = "실패: " + json.error; btn.disabled = false; return; }
    btn.textContent = label + " 완료";
    fetchData().then(() => renderDetail(DATA.applicants.find(p => p.rowIndex === rowIndex)));
  }).catch(err => { btn.textContent = "실패: " + err.message; btn.disabled = false; });
}

function trainBtn(rowIndex, btn) {
  btn.disabled = true; btn.textContent = "발급 중...";
  callAdmin("adminConfirmTraining", { rowIndex: rowIndex }).then(json => {
    if (!json.ok) { btn.textContent = "실패: " + json.error; btn.disabled = false; return; }
    if (json.docsDone) { btn.textContent = "이수확인 완료(서류는 이미 제출·인정돼 링크 발급 안 함)"; fetchData().then(() => renderDetail(DATA.applicants.find(p => p.rowIndex === rowIndex))); return; }
    btn.textContent = "발급 완료";
    const link = "https://safeppl.github.io/maeum-salpigi/recruit/upload.html?t=" + json.token;
    const msg = "[안전한더유스] " + json.name + "님, 양성교육 이수를 축하드려요!\n실전 투입 전에 서류(이력서·자격증·신분증사본·통장사본·계약서) 제출이 필요해요.\n아래 링크에서 업로드해 주세요.\n" + link;
    document.getElementById("linkBox").style.display = "block";
    document.getElementById("linkText").value = msg;
  }).catch(err => { btn.textContent = "실패: " + err.message; btn.disabled = false; });
}

function copyLink() {
  const ta = document.getElementById("linkText"); ta.focus(); ta.select();
  try { document.execCommand("copy"); document.getElementById("copyMsg").textContent = "복사했어요."; }
  catch (e) { document.getElementById("copyMsg").textContent = "직접 선택해 복사해주세요."; }
}

function renderDetail(p) {
  if (!p) return;
  let h = '<p class="m"><b>' + esc(p.name) + ' · ' + esc(p.phone) + '</b> · ' + esc(p.status) + '</p>';
  h += '<p class="m">' + esc(p.sido) + ' ' + esc(p.sigungu) + ' · ' + esc(/^\d{1,3}$/.test(String(p.age)) ? p.age + '세' : p.age) + ' ' + esc(p.sex) + ' · 소속: ' + esc(p.org || "—") + '</p>';
  h += '<p class="m">희망역할: ' + esc(roleNames(p.roles)) + '</p>';
  h += '<p class="m">활동경력: ' + esc(p.exp || "—") + '</p>';
  h += '<p class="m">참여동기: ' + esc(p.motive || "—") + '</p>';
  // 2026-11-24: 담당사업 — 사업마다 역할을 골라 여러 줄로 지정해요(예: 도봉구-일경험 코치, 미래내일일경험-동행코치)
  h += '<div style="margin:10px 0;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px">' +
    '<b style="font-size:13px">담당사업</b><div id="assignRows"></div>' +
    '<div class="btns"><button class="act rej" id="assignAdd">+ 사업 추가</button><button class="act coach" id="assignSave">담당사업 저장</button><span class="m" id="assignMsg"></span></div></div>';
  if (p.done.length) h += '<p class="m">이미 처리됨: ' + esc(p.done.join(", ")) + '</p>';
  // 2026-11-23: 이수·서류 상태를 항상 보여줘요(예전엔 이수확인 전이면 서류 상태가 안 보여서, 이미 "기존 서류 인정"된 사람인지 알 수 없었음)
  if (p.done.length && p.showReject) h += '<p class="m">양성교육: ' + (p.trainedAt ? "이수확인 " + esc(p.trainedAt) : "이수확인 전") +
    ' · 서류: ' + (p.docSubmittedAt ? (p.docsAcknowledged ? "기존 서류 인정 " : "업로드 제출 ") + esc(p.docSubmittedAt) : "미제출") + '</p>';
  const isComplete = p.showReject && !p.showCoach && !p.showActivist && !p.needsTraining && p.docSubmittedAt;
  if (isComplete) h += '<p class="m" style="color:#2C6765;font-weight:700">✅ 등록 완료 — 희망한 역할 등록, 양성교육 이수확인, 서류 제출까지 모두 끝났어요.</p>';
  h += '<div class="btns">' +
    (p.showCoach ? '<button class="act coach" id="btnCoach">일경험 코치로 등록</button>' : '') +
    (p.showActivist ? '<button class="act activist" id="btnActivist">동행활동가로 등록</button>' : '') +
    (p.showCoach && p.showActivist ? '<button class="act activist" id="btnBoth">동행활동가+일경험 코치 둘 다 등록</button>' : '') +
    (p.showReject ? '<button class="act rej" id="btnReject">반려</button>' : '') +
    (p.needsTraining ? '<button class="act coach" id="btnTrain">' + (p.docSubmittedAt ? '이수확인(서류는 이미 제출·인정됨)' : '이수확인 · 서류 업로드 링크 발급') + '</button>' : '') +
    (p.canAcknowledgeDocs ? '<button class="act rej" id="btnAck">기존 서류 제출 인정(재업로드 생략)</button>' : '') +
    (p.docsAcknowledged ? '<button class="act rej" id="btnUnack">서류 인정 취소</button>' : '') +
    (p.addableRoles || []).map(r => '<button class="act ' + (r === "코치" ? "coach" : "activist") + ' addRole" data-role="' + r + '">' + ROLE_NAME[r] + ' 역할 추가 등록</button>').join("") +
    '</div>';
  h += '<div class="btns"><button class="act rej" id="btnDocs">📁 서류 보기</button></div><div id="docPanel"></div>';
  h += '<div class="btns" style="margin-top:24px;padding-top:12px;border-top:1px solid var(--border)">' +
    '<button class="act" id="btnDelete" style="background:#B3261E;color:#fff">🗑 잘못 제출된 신청 삭제</button></div>';
  h += '<div class="linkBox" id="linkBox" style="display:none"><textarea id="linkText" readonly></textarea>' +
    '<div class="btns"><button class="act rej" id="btnCopy">문구 복사</button><span class="m" id="copyMsg"></span></div></div>';
  document.getElementById("main").innerHTML = h;
  if (p.showCoach) document.getElementById("btnCoach").addEventListener("click", e => act(p.rowIndex, "adminApproveCoach", e.target, "일경험 코치 등록"));
  if (p.showActivist) document.getElementById("btnActivist").addEventListener("click", e => act(p.rowIndex, "adminApproveActivist", e.target, "동행활동가 등록"));
  if (p.showCoach && p.showActivist) document.getElementById("btnBoth").addEventListener("click", e => act(p.rowIndex, "adminApproveBoth", e.target, "동행활동가+일경험 코치 등록"));
  if (p.showReject) document.getElementById("btnReject").addEventListener("click", e => act(p.rowIndex, "adminReject", e.target, "반려"));
  if (p.needsTraining) document.getElementById("btnTrain").addEventListener("click", e => trainBtn(p.rowIndex, e.target));
  if (p.canAcknowledgeDocs) document.getElementById("btnAck").addEventListener("click", e => act(p.rowIndex, "adminAcknowledgeDocs", e.target, "서류 제출 인정"));
  if (p.docsAcknowledged) document.getElementById("btnUnack").addEventListener("click", e => { if (confirm(p.name + "님의 '기존 서류 인정'을 취소할까요? 서류 미제출 상태로 돌아가요.")) act(p.rowIndex, "adminUnacknowledgeDocs", e.target, "서류 인정 취소"); });
  // 한 역할로만 신청한 사람에게 다른 역할을 재신청 없이 추가하고 바로 등록해요(희망역할에도 기록됨)
  document.querySelectorAll(".addRole").forEach(b => b.addEventListener("click", e => {
    const role = b.dataset.role;
    if (confirm(p.name + "님을 " + ROLE_NAME[role] + "(으)로도 등록할까요? 희망역할에 추가되고 바로 등록돼요.")) act(p.rowIndex, "adminAddRole", e.target, ROLE_NAME[role] + " 역할 추가 등록", { role: role });
  }));
  document.getElementById("btnCopy") && document.getElementById("btnCopy").addEventListener("click", copyLink);
  document.getElementById("btnDelete").addEventListener("click", e => deleteApplicant(p, e.target));
  document.getElementById("btnDocs").addEventListener("click", e => showDocs(p, document.getElementById("docPanel"), e.target));
  bindAssignments(p);
}

function assignRowHtml(a) {
  const bizs = BIZ_ALL.indexOf(a.biz) >= 0 || !a.biz ? BIZ_ALL : BIZ_ALL.concat([a.biz]);
  const sel = (list, cur, cls) => '<select class="' + cls + '" style="font:inherit;padding:5px;border:1px solid var(--border);border-radius:6px;margin-right:6px">' +
    list.map(v => '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + '>' + esc(v) + '</option>').join("") + '</select>';
  return '<div class="aRow" style="margin-top:6px">' + sel(bizs, a.biz, "aBiz") + sel(ASSIGN_ROLES, a.role, "aRole") +
    '<button class="act rej aDel" style="padding:4px 10px">빼기</button></div>';
}
function bindAssignments(p) {
  const box = document.getElementById("assignRows");
  box.innerHTML = (p.assignments || []).map(assignRowHtml).join("") || '<p class="m aEmpty">아직 지정된 사업이 없어요.</p>';
  box.addEventListener("click", e => { if (e.target.classList.contains("aDel")) e.target.closest(".aRow").remove(); });
  document.getElementById("assignAdd").onclick = () => {
    const empty = box.querySelector(".aEmpty"); if (empty) empty.remove();
    box.insertAdjacentHTML("beforeend", assignRowHtml({ biz: BIZ_ALL[0], role: ASSIGN_ROLES[0] }));
  };
  document.getElementById("assignSave").onclick = async e => {
    const btn = e.target, msg = document.getElementById("assignMsg");
    const list = [...box.querySelectorAll(".aRow")].map(r => ({ biz: r.querySelector(".aBiz").value, role: r.querySelector(".aRole").value }));
    btn.disabled = true; msg.textContent = "저장 중...";
    try {
      const json = await callAdmin("adminSetAssignments", { rowIndex: p.rowIndex, name: p.name, assignments: list });
      if (!json.ok) { msg.textContent = "실패: " + json.error; btn.disabled = false; return; }
      await fetchData();
      renderDetail(DATA.applicants.find(x => x.rowIndex === p.rowIndex));
      document.getElementById("assignMsg").textContent = "저장했어요.";
    } catch (err) { msg.textContent = "실패: " + err.message; btn.disabled = false; }
  };
}

// 2026-11-24: 잘못 제출된 신청을 지워요. 시트의 [삭제된 신청] 탭으로 옮겨지는 거라 거기서 되살릴 수 있어요.
function deleteApplicant(p, btn) {
  let warn = p.name + "님(" + p.appliedAt + " 접수)의 신청을 삭제할까요?\n\n목록에서 사라지고 시트의 [삭제된 신청] 탭으로 옮겨져요. 잘못 지웠으면 그 탭에서 되살릴 수 있어요.";
  if (p.done.length) warn += "\n\n⚠️ 이미 처리된 사람이에요 (" + p.done.join(", ") + ").\n마음살피기·위드워킹·일경험 쪽에 등록된 기록은 지워지지 않고 그대로 남아요.";
  if (!confirm(warn)) return;
  btn.disabled = true; btn.textContent = "삭제 중...";
  callAdmin("adminDelete", { rowIndex: p.rowIndex, name: p.name }).then(json => {
    if (!json.ok) { btn.textContent = "실패: " + json.error; btn.disabled = false; return; }
    fetchData().then(renderDashboard);
  }).catch(err => { btn.textContent = "실패: " + err.message; btn.disabled = false; });
}

document.getElementById("dashBtn").addEventListener("click", renderDashboard);
document.getElementById("bizFilter").addEventListener("change", renderList);
renderBizFilter();
document.getElementById("search").addEventListener("input", renderList);
load();
