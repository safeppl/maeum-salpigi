<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>나의 마음살피기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: participant side is a calm phone-width column (one question per screen); staff side widens into a working dashboard. */
:root {
  --bg: #EDF1EC;
  --surface: #FAFBF8;
  --ink: #1E2A2B;
  --muted: #5A6968;
  --line: #D2DAD3;
  --accent: #2C6765;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE8E5;
  --dawn: #D68B47;
  --dawn-soft: #F6E3CF;
  --ok: #3E7B57;
  --watch: #A97A1F;
  --care: #B0523E;
  --font-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121918; --surface: #1A2423; --ink: #E5ECE8; --muted: #9AABA7; --line: #2D3B3A;
    --accent: #7FBBB5; --accent-ink: #0E1716; --accent-soft: #223534; --dawn: #E5A465; --dawn-soft: #3A2D21;
    --ok: #7DBF94; --watch: #DDB35A; --care: #E58D78; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121918; --surface: #1A2423; --ink: #E5ECE8; --muted: #9AABA7; --line: #2D3B3A;
  --accent: #7FBBB5; --accent-ink: #0E1716; --accent-soft: #223534; --dawn: #E5A465; --dawn-soft: #3A2D21;
  --ok: #7DBF94; --watch: #DDB35A; --care: #E58D78; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; } body { margin: 0; } :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } img { max-width: 100%; } [hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; padding-inline: 16px; padding-block: 0 40px; word-break: keep-all; overflow-wrap: anywhere; }
.app { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.app.wide { max-width: 1040px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.35; text-wrap: balance; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }

/* prototype chrome */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-block: 12px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.proto-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.stages { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.stages button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.stages button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.proto-label { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.review-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 6px; }
.review-toggle i { width: 26px; height: 16px; border-radius: 999px; background: var(--line); position: relative; }
.review-toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); transition: transform .2s; }
.review-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.review-toggle[aria-pressed="true"] i { background: var(--accent); }
.review-toggle[aria-pressed="true"] i::after { transform: translateX(10px); }
.review-note { font-size: 13px; line-height: 1.55; color: var(--muted); border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--accent-soft); }
.review-note b { color: var(--accent); }

.brand { display: flex; align-items: baseline; gap: 8px; padding-top: 6px; }
.brand b { font-family: var(--font-display); font-size: 17px; }
.brand span { font-size: 13px; color: var(--muted); }

/* hero / intro */
.hero { display: flex; flex-direction: column; gap: 16px; padding-top: 4px; }
.hero svg { width: 120px; height: auto; max-width: 100%; }
.hero h1 { font-size: 28px; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.facts li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 15px; }
.facts li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dawn); margin: 9px 0 0 6px; }
.code-badge { display: inline-flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 12px; padding: 12px 16px; align-self: flex-start; }
.code-badge small { font-size: 12px; color: var(--muted); }
.code-badge b { font-size: 22px; letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--accent); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding-bottom: 14px; position: relative; }
.timeline li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); margin: 6px 0 0 4px; z-index: 1; }
.timeline li::after { content: ""; position: absolute; left: 11px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li.done::before { background: var(--accent); border-color: var(--accent); }
.timeline li.now::before { border-color: var(--dawn); background: var(--dawn); }
.timeline b { display: block; font-size: 15px; }
.timeline span { font-size: 14px; color: var(--muted); }

.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 20px; font-weight: 600; font-size: 16px; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-dawn { background: var(--dawn); color: #1E1508; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link-btn { background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; align-self: center; }

/* progress */
.progress { display: grid; gap: 8px; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.steps span { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
.steps span b { position: absolute; inset: 0; background: var(--accent); transform-origin: left; }
.step-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.sec-intro { display: flex; flex-direction: column; gap: 14px; padding-top: 24px; }
.eyebrow { font-size: 13px; letter-spacing: .06em; color: var(--accent); font-weight: 600; }
.sec-intro h2 { font-size: 28px; }
.q { display: flex; flex-direction: column; gap: 22px; padding-top: 8px; }
.q-lead { font-size: 14px; color: var(--muted); }
.q h2 { font-size: 23px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.opt:hover { border-color: var(--accent); }
.opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"] .dot { border-color: var(--accent); }
.opt[aria-checked="true"] .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.follow { display: grid; gap: 12px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 12px; padding: 16px; }
.follow b { font-size: 16px; }
.nav-row { display: flex; justify-content: space-between; align-items: center; }
.src { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; align-self: flex-start; }

/* contacts */
.contacts { display: grid; gap: 8px; }
.contact-line { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center; background: var(--surface); border-radius: 10px; padding: 10px 14px; text-decoration: none; color: var(--ink); }
.contact-line span { font-size: 14px; font-weight: 600; }
.contact-line b { font-size: 18px; font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
.guide { background: var(--accent-soft); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; }
.guide h3 { font-size: 19px; }

/* results */
.result-head { display: grid; gap: 10px; padding-top: 4px; }
.result-head h1 { font-size: 26px; }
.panel { background: var(--surface); border-radius: var(--r); padding: 18px; display: grid; gap: 16px; min-width: 0; }
.panel h3 { font-size: 18px; }
.panel h4 { font-size: 15px; margin: 4px 0 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dom { display: grid; gap: 6px; }
.dom-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.dom-top b { font-size: 15px; }
.chip { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.watch { color: var(--watch); background: color-mix(in srgb, var(--watch) 16%, transparent); }
.chip.care { color: var(--care); background: color-mix(in srgb, var(--care) 14%, transparent); }
.chip.info { color: var(--accent); background: var(--accent-soft); }
.chip.muted { color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); }
.track { height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.track i.ok { background: var(--ok); } .track i.watch { background: var(--watch); } .track i.care { background: var(--care); }
.track .cut { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .5; }
.dom p { font-size: 14px; color: var(--muted); }

/* change (dumbbell) */
.dumb { display: grid; gap: 4px; }
.dumb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; align-items: baseline; }
.dumb-top b { font-size: 15px; }
.dumb-top em { font-style: normal; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dumb-top em.better { color: var(--ok); } .dumb-top em.worse { color: var(--care); } .dumb-top em.same { color: var(--muted); }
.dtrack { position: relative; height: 18px; }
.dtrack::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--line); border-radius: 1px; }
.dtrack .seg-line { position: absolute; top: 7px; height: 4px; border-radius: 2px; background: var(--accent); opacity: .5; }
.dtrack .pre, .dtrack .post { position: absolute; top: 3px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-6px); }
.dtrack .pre { background: var(--surface); border: 2px solid var(--muted); }
.dtrack .post { background: var(--accent); }
.dtrack .cut { position: absolute; top: 1px; height: 16px; width: 0; border-left: 2px dotted var(--care); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend i.pre { border: 2px solid var(--muted); }
.legend i.post { background: var(--accent); }
.legend i.cut { width: 0; height: 12px; border-radius: 0; border-left: 2px dotted var(--care); }

/* forms */
.form { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
.field label, .field legend { font-weight: 600; font-size: 15px; }
.hint { font-size: 13px; color: var(--muted); font-weight: 400; }
.field input[type=text], .field input[type=tel], .field input[type=number], .field textarea, .field select, .follow input[type=text] { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; }
.field select:disabled { opacity: .5; }
.field textarea { min-height: 80px; resize: vertical; }
.addr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 400px) { .addr { grid-template-columns: minmax(0, 1fr); } }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices label { font-weight: 400; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
.choices input { accent-color: var(--accent); }
.consent { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 14px; background: var(--surface); border-radius: 10px; padding: 12px 14px; }
.consent input { accent-color: var(--accent); margin-top: 4px; }
.err { color: var(--care); font-size: 13px; }
.elig { font-size: 14px; border-radius: 10px; padding: 10px 12px; }
.elig.yes { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.elig.no { background: color-mix(in srgb, var(--care) 10%, transparent); }
.likert { display: grid; gap: 6px; }
.likert-q { font-size: 15px; font-weight: 600; }
.likert-opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.likert-opts label { display: grid; place-items: center; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 0; cursor: pointer; font-variant-numeric: tabular-nums; font-size: 15px; }
.likert-opts input { position: absolute; opacity: 0; pointer-events: none; }
.likert-opts label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.likert-opts label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.likert-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.foot { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; font-size: 13px; color: var(--muted); }

/* staff dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi small { font-size: 13px; color: var(--muted); }
.kpi b { font-size: 26px; font-variant-numeric: tabular-nums; font-family: var(--font-display); }
.kpi.alert b { color: var(--care); }
.dash { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .dash { grid-template-columns: minmax(0, 1fr); } }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 600px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.pick tbody tr { cursor: pointer; }
.pick tbody tr:hover td, .pick tbody tr[aria-selected="true"] td { background: var(--accent-soft); }
td.code { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.pipe { display: inline-flex; gap: 3px; }
.pipe i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.pipe i.on { background: var(--accent); }
.pipe i.wait { background: var(--dawn); }
.flags { display: flex; gap: 4px; flex-wrap: wrap; }
.detail { display: grid; gap: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.type-tag { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.type-tag strong { font-size: 15px; }
.export table { min-width: 860px; font-size: 12px; }
.export td, .export th { padding: 6px 8px; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.fade { animation: fade .28s ease-out; }
@keyframes fade { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>

  // ── 검사 ──
  function progress() {
    const { si } = FLAT[S.pos];
    const steps = SECTIONS.map((s, i) => {
      const f = i < si ? 1 : i === si ? (S.secIntro ? 0 : FLAT[S.pos].ii / s.items.length) : 0;
      return `<span><b style="transform:scaleX(${f})"></b></span>`;
    }).join("");
    return `<div class="progress"><div class="steps">${steps}</div>
      <div class="step-label"><span>${si + 1} / ${SECTIONS.length} · ${SECTIONS[si].title}</span><span>${S.pos + 1} / ${FLAT.length}</span></div></div>`;
  }
  function secIntro() {
    const s = SECTIONS[FLAT[S.pos].si];
    return `${progress()}

      <span class="eyebrow">${FLAT[S.pos].si + 1}번째 · ${s.items.length}문항</span>
      <h2>${s.title}</h2><p class="muted">${s.intro}</p>
      <button class="btn btn-primary btn-block" data-act="go">시작</button>
      <div class="nav-row"><button class="link-btn" data-act="back">이전으로</button><span></span></div>
    </section>`;
  }
  const needsFollow = (it, v) => it.follow && v >= 2;
  function question() {
    const { si, ii } = FLAT[S.pos], s = SECTIONS[si], it = s.items[ii];
    const scale = s.scale || FREQ, base = s.base || 0, cur = S.ans[it.id], showFollow = needsFollow(it, cur);
    const followHtml = showFollow ? `<div class="follow fade"><label for="helperText"><b>그 사람은 누구인가요?</b></label>
        <span class="hint">이름 대신 나와의 관계로 적어도 괜찮아요 (예: 엄마, 고등학교 친구)</span>
        <input type="text" id="helperText" name="helperText" placeholder="누구인지 적어주세요" value="${esc(S.helper)}">
        <button class="btn btn-primary btn-block" data-act="next" ${S.helper.trim() ? "" : "disabled"}>다음</button></div>` : "";
    return `${progress()}
    <section class="q fade" aria-live="polite">
      <p class="q-lead">${s.lead}</p><h2>${it.t}</h2>
      <div class="opts" role="radiogroup">${scale.map((label, k) => `<button class="opt" role="radio" aria-checked="${cur === k + base}" data-act="answer" data-v="${k + base}"><span class="dot"></span>${label}</button>`).join("")}</div>
      ${followHtml}
      <div class="nav-row"><button class="link-btn" data-act="back">이전 문항</button>${cur !== undefined && !showFollow ? `<button class="link-btn" data-act="next">다음</button>` : "<span></span>"}</div>
    </section>`;
  }
  function score(ans) {
    const val = it => { const v = ans[it.id]; return v === undefined ? undefined : it.rev ? 3 - v : v; };
    const avg = items => { const v = items.map(val).filter(x => x !== undefined); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
    const by = id => SECTIONS.find(s => s.id === id).items, mind = by("mind");
    return { rel: avg(by("rel")), emo: avg(by("emo")), daily: avg(by("daily")), hope: avg(mind.slice(0, 3)), mindAll: avg(mind),
      gse: by("gse").reduce((a, i) => a + (ans[i.id] || 0), 0) };
  }

  // ── 신청 접수 완료 ──

  function dumbRow(name, pre, post, max, invert) {
    const x = v => Math.max(0, Math.min(100, (v / max) * 100));
    const d = post - pre, better = invert ? d > 0 : d < 0, eps = max > 3 ? 1 : 0.2;
    const cls = Math.abs(d) < eps ? "same" : better ? "better" : "worse";
    const amt = max > 3 ? Math.abs(d).toFixed(0) + "점" : Math.abs(d).toFixed(1) + "점";
    const txt = cls === "same" ? "비슷해요" : invert ? `${amt} ${better ? "단단해졌어요" : "약해졌어요"}` : `${amt} ${better ? "가벼워졌어요" : "무거워졌어요"}`;
    const lo = Math.min(x(pre), x(post)), hi = Math.max(x(pre), x(post));
    return `<div class="dumb"><div class="dumb-top"><b>${name}</b><em class="${cls}">${txt}</em></div>
      <div class="dtrack"><span class="seg-line" style="left:${lo}%;width:${hi - lo}%"></span><span class="pre" style="left:${x(pre)}%"></span><span class="post" style="left:${x(post)}%"></span></div></div>`;
  }
  const legend = txt => `<div class="legend"><span><i class="pre"></i>처음</span><span><i class="post"></i>지금</span><span>${txt}</span></div>`;

  // ── 나의 변화: 숫자에 의미를 붙여요 ──
  // 서버와 같은 이름의 점수(관계, 정서, 일상, 무망감, 대인기피, 비난, 회피, 수동공격, 효능감)로 바꿔요.
  function keyed(ans) {
    const s = score(ans), mind = SECTIONS.find(x => x.id === "mind").items;
    const t = from => mind.slice(from, from + 3).reduce((a, it) => a + (ans[it.id] || 0), 0) / 3;
    return { 관계: s.rel, 정서: s.emo, 일상: s.daily, 무망감: s.hope, 대인기피: t(3), 비난: t(6), 회피: t(9), 수동공격: t(12), 효능감: s.gse };
  }
  const mindAll = o => (o.무망감 + o.대인기피 + o.비난 + o.회피 + o.수동공격) / 5;
  const AREAS = [

      next: "다음 주에 해보고 싶은 아주 작은 일 하나 적어 두기" },

  function areaState(pre, post) {

  function changeScreen() {
    const R = S.result, P = R.pre, Q = R.post;
    const val = (o, k) => k === "mind" ? mindAll(o) : o[k];
    const rows = AREAS.map(a => ({ a, pre: val(P, a.key), post: val(Q, a.key) })).map(r => Object.assign(r, { st: areaState(r.pre, r.post), gain: r.pre - r.post }));
    const gseGain = Q.효능감 - P.효능감;
    const cands = rows.map(r => ({ name: r.a.name, gain: r.gain / 3, text: r.a.better })).concat([{ name: "나의 힘", gain: gseGain / 30, text: "‘나도 해낼 수 있다’는 믿음이 자랐어요. 함께한 시간 동안 직접 해낸 경험들이 쌓인 결과예요." }]);
    const top = cands.filter(c => c.gain > 0.05).sort((x, y) => y.gain - x.gain)[0];
    const better = rows.filter(r => r.st === "better").map(r => r.a.name);
    const needs = rows.filter(r => r.st === "worse" || lvIdx(r.post) === 2);
    const gseText = gseGain >= 3 ? "‘나도 해낼 수 있다’는 믿음이 자랐어요. 함께한 시간 동안 직접 해낸 경험들이 쌓인 결과예요."
      : gseGain <= -3 ? "요즘 스스로를 믿기 어려웠을 수 있어요. 지금까지 버텨온 것 자체가 힘이에요."
      : "스스로를 믿는 마음을 지켜왔어요. 작은 성공을 하나씩 쌓으면 더 단단해져요.";
    const name = who();
    const helperPre = esc(R.helperPre || ""), helperPost = esc(R.helperPost || "");
    return `${brand()}
    <section class="result-head fade"><span class="eyebrow">${S.revisit ? "다시 보는 나의 변화" + (R.doneAt ? " · " + esc(R.doneAt) + " 기록" : "") : "모두 마쳤어요"}</span>
      <h1>${name ? name + "님의 " : "나의 "}변화</h1>
      <p class="muted">숫자는 성적이 아니에요. 처음의 나와 지금의 나를 나란히 비춰보는 거울이에요.
        ${better.length ? `처음과 비교해 <b>${better.join(", ")}</b>에서 변화가 보여요. 그 변화는 ${name ? name + "님이" : "내가"} 직접 만들어 낸 거예요.` : "숫자로는 큰 변화가 보이지 않아도, 끝까지 함께한 시간 자체가 이미 큰 걸음이에요."}</p></section>
    <section class="guide" style="background:var(--dawn-soft)">
      <span class="eyebrow" style="color:var(--dawn)">${top ? "가장 크게 달라진 것" : "변화보다 소중한 것"}</span>
      <h3>${top ? top.name : "멈추지 않고 끝까지 온 것"}</h3>
      <p>${top ? top.text : "회복은 직선이 아니라 오르내리며 나아가요. 활동을 시작하고 마지막까지 함께한 것 자체가 다시 움직이기 시작했다는 증거예요."}</p>
    </section>
    ${helperPost || helperPre ? `<section class="panel"><h3>힘들 때 떠오르는 사람</h3>
      <dl class="kv"><dt>처음</dt><dd>${helperPre || "떠오르는 사람이 없었어요"}</dd><dt>지금</dt><dd><b>${helperPost || "떠오르는 사람이 없어요"}</b></dd></dl>
      <p class="muted" style="font-size:14px">${helperPost && !helperPre ? "힘들 때 떠올릴 사람이 생겼어요. 숫자보다 더 큰 변화일 수 있어요." : helperPost ? "기댈 수 있는 사람이 곁에 있어요. 그 연결을 소중히 이어가 보세요." : "아직 떠오르는 사람이 없어도 괜찮아요. 더유스가 그 한 사람이 되어 드릴게요."}</p></section>` : ""}
    ${R.good ? `<section class="panel"><h3>내가 꼽은 가장 도움이 된 것</h3><p style="font-size:16px">“${esc(R.good)}”</p>
      <p class="muted" style="font-size:14px">도움이 되었던 것을 알면, 앞으로 힘들 때 무엇을 붙잡으면 될지도 알 수 있어요.</p></section>` : ""}
    <section class="panel"><h3>영역별로 보면</h3>${legend("왼쪽일수록 가벼운 상태")}
      ${rows.map(r => `${dumbRow(r.a.name, r.pre, r.post, 3)}<p class="muted" style="font-size:14px;margin-top:-6px">${r.a[r.st]}</p>`).join("")}</section>
    <section class="panel" style="background:var(--dawn-soft)"><h3>나의 힘</h3>${legend("오른쪽일수록 단단한 상태")}
      ${dumbRow("자기효능감", P.효능감 - 10, Q.효능감 - 10, 30, true)}<p class="muted" style="font-size:14px;margin-top:-6px">${gseText}</p></section>
    <section class="panel"><h3>앞으로 한 걸음</h3>
      ${needs.length ? `<p class="muted" style="font-size:14px">아직 무겁게 느껴지는 영역이 있어요. 이런 것부터 해보면 어떨까요?</p>
        <ol class="next">${needs.slice(0, 3).map(r => `<li><span><b>${r.a.name}</b> · ${r.a.next}</span></li>`).join("")}</ol>`
        : `<p class="muted" style="font-size:14px">지금의 리듬을 그대로 이어가 보세요. 힘든 날이 다시 와도, 이번에 해낸 경험이 있다는 걸 기억해 주세요.</p>`}
      <p style="font-size:14px">더 이야기 나누고 싶다면 언제든 연락 주세요.</p>${CONTACT_HTML}</section>
    <div class="review-note" style="border-style:solid"><b>이 화면을 다시 보려면</b> · 받은 링크로 언제든 다시 들어오면 돼요. 문자나 카카오톡 메시지를 지우지 말고 남겨 두세요. 휴대폰 브라우저 메뉴에서 ‘홈 화면에 추가’를 해두면 더 쉽게 열 수 있어요.</div>`;
  }
  function msgScreen(title, body) {
    return `${brand()}<section class="hero fade">${windowArt()}<h1>${title}</h1><p class="muted">${body}</p></section>${guideCard()}`;
  }
  function resumeScreen() {
    return `${brand()}<section class="hero fade">${windowArt()}
      <h1>이어서 할까요?</h1><p class="muted">지난번 ${S.pos + 1}번째 문항에서 멈췄어요. 그동안 답한 내용은 그대로 있어요.</p>
      <button class="btn btn-primary btn-block" data-act="resume">이어서 하기</button>
      <button class="btn btn-ghost btn-block" data-act="fresh">처음부터 다시 하기</button></section>`;
  }

  // ── 렌더 ──
  function render() {
    const sc = S.screen;
    let body;
    if (sc === "form") body = formScreen();
    else if (sc === "survey") body = S.secIntro ? secIntro() : question();
    else if (sc === "sending") body = msgScreen("보내는 중이에요", "잠시만 기다려 주세요. 창을 닫지 말아 주세요.").replace(guideCard(), "");
    else if (sc === "sendError") body = `${msgScreen("보내지 못했어요", "인터넷 연결을 확인하고 다시 보내기를 눌러주세요. 답한 내용은 이 기기에 남아 있어요.")}
      <button class="btn btn-primary btn-block" data-act="retry">다시 보내기</button>`;
    else if (sc === "done") body = doneScreen();
    else if (sc === "loading") body = msgScreen("불러오는 중이에요", "잠시만 기다려 주세요.").replace(guideCard(), "");
    else if (sc === "invalid") body = msgScreen("링크를 확인해 주세요", "이 링크로는 열 수 없어요. 받은 링크를 다시 확인하거나 아래로 문의해 주세요.");
    else if (sc === "notyet") body = msgScreen("아직 열리지 않았어요", "활동을 마칠 때 관리자가 열어 드려요. 그때 이 링크로 다시 들어와 주세요.");
    else if (sc === "postWelcome") body = postWelcome();
    else if (sc === "resume") body = resumeScreen();
    else if (sc === "sat") body = satScreen();
    else body = changeScreen();
    app.innerHTML = banner() + body;
  }
  const top = () => window.scrollTo(0, 0);
  const go = sc => { S.screen = sc; store.set(); render(); top(); };

  async function api(payload) {
    const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    return res.json();
  }
  async function submit() {
    const secs = Math.round((Date.now() - S.t0) / 1000);
    S.screen = "sending"; render(); top();
    if (DEMO) {
      if (MODE === "pre") { store.clear(); S.screen = "done"; }
      else {
        S.result = { pre: { 관계: 2, 정서: 2, 일상: 2, 무망감: 2.3, 대인기피: 2, 비난: 1.3, 회피: 2.3, 수동공격: 1, 효능감: 18 }, post: keyed(S.ans),
          helperPre: "", helperPost: S.helper, good: S.satOpen.good || "", doneAt: "" };
        store.clear(); S.screen = "change";
      }
      render(); top(); return;
    }
    try {
      const r = MODE === "pre"
        ? await api({ action: "apply", apply: S.apply, answers: S.ans, helper: S.helper, secs })
        : await api({ action: "post", token, answers: S.ans, helper: S.helper, sat: S.sat, satOpen: S.satOpen, secs });
      if (!r.ok) {
        if (r.error === "not_open") { store.clear(); S.screen = "notyet"; render(); return; }
        throw new Error(r.error);
      }
      store.clear();
      if (MODE === "pre") S.screen = "done";
      else { S.result = r.result; S.screen = "change"; }
    } catch (e) { S.screen = "sendError"; }
    render(); top();
  }
  function advance() {
    if (S.pos < FLAT.length - 1) { S.pos++; if (FLAT[S.pos].ii === 0) S.secIntro = true; store.set(); S.lock = false; render(); top(); }
    else { S.lock = false; submit(); }
  }
  function back() {
    if (S.secIntro) {
      if (S.pos === 0) { go(MODE === "pre" ? "form" : "sat"); return; }
      S.pos--; S.secIntro = false;
    } else if (FLAT[S.pos].ii === 0) S.secIntro = true;
    else S.pos--;
    store.set(); render(); top();
  }
  function startSurvey() { S.pos = 0; S.secIntro = true; S.ans = {}; S.helper = ""; S.t0 = Date.now(); go("survey"); }

  app.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === "go") { S.secIntro = false; store.set(); render(); top(); return; }
    if (act === "back") { back(); return; }
    if (act === "next") { advance(); return; }
    if (act === "answer") {
      if (S.lock) return;
      const it = SECTIONS[FLAT[S.pos].si].items[FLAT[S.pos].ii], v = Number(b.dataset.v);
      S.ans[it.id] = v;
      if (needsFollow(it, v)) { store.set(); render(); return; }
      if (it.follow) S.helper = "";
      S.lock = true; render(); setTimeout(advance, 260); return;
    }
    if (act === "retry") { submit(); return; }
    if (act === "resume") { const d = store.get(); Object.assign(S, d || {}); if (!S.t0) S.t0 = Date.now(); render(); top(); return; }
    if (act === "fresh") { store.clear(); Object.assign(S, { ans: {}, helper: "", apply: {}, sat: {}, satOpen: {}, pos: 0, secIntro: true }); go(MODE === "pre" ? "form" : "postWelcome"); return; }
    if (act === "to-sat") { go("sat"); return; }
    if (act === "demo-post") { location.search = "?t=demo"; return; }
  });

  app.addEventListener("input", ev => {
    const t = ev.target, f = t.form;
    if (t.name === "helperText") {
      S.helper = t.value;
      t.closest(".follow").querySelector('[data-act="next"]').disabled = !t.value.trim();
      store.set(); return;
    }
    if (!f) return;
    if (f.id === "apply-form") {
      const a = S.apply;
      if (t.name === "want") a.want = [...f.querySelectorAll('input[name="want"]:checked')].map(x => x.value);
      else if (t.type === "checkbox") a[t.name] = t.checked;
      else a[t.name] = t.value;
      if (t.name === "sido" || t.name === "sigungu") { if (t.name === "sido") a.sigungu = ""; f.querySelector("#addr").innerHTML = addrHtml(); }
      if (["contact", "house", "route"].includes(t.name)) { const w = f.querySelector("#" + t.name + "-etc-wrap"); w.hidden = t.value !== "etc"; if (t.value === "etc") w.querySelector("input").focus(); }
      if (["sido", "sigungu", "year"].includes(t.name)) { const el = eligibility(); f.querySelector("#elig").innerHTML = el ? eligHtml(el) : ""; }
    } else if (f.id === "sat-form") {
      if (t.type === "radio") S.sat[t.name] = Number(t.value); else S.satOpen[t.name] = t.value;
    }
    store.set();
  });
  app.addEventListener("change", ev => { if (ev.target.tagName === "SELECT") ev.target.dispatchEvent(new Event("input", { bubbles: true })); });

  app.addEventListener("submit", ev => {
    ev.preventDefault();
    if (ev.target.id === "sat-form") {
      if (SAT.some((_, i) => !S.sat["s" + i])) { S.satErr = true; render(); const e = app.querySelector(".err"); if (e) e.scrollIntoView({ block: "center" }); return; }
      S.satErr = false; startSurvey(); return;
    }
    const a = S.apply, e = {}, y = parseInt(a.year, 10), blank = k => !a[k] || !String(a[k]).trim();
    if (blank("name")) e.name = 1;
    if (!a.sex) e.sex = 1;
    if (!(y > 1900 && y <= YEAR)) e.year = 1;
    if (blank("sido") || blank("sigungu") || blank("dong")) e.addr = 1;
    if (!/^01[016789]-?\d{3,4}-?\d{4}$/.test((a.phone || "").trim())) e.phone = 1;
    if (!a.contact) e.contact = 1;
    if (a.contact === "etc" && blank("contactEtc")) e.contactEtc = 1;
    if (a.house === "etc" && blank("houseEtc")) e.houseEtc = 1;
    if (a.route === "etc" && blank("routeEtc")) e.routeEtc = 1;
    if (!a.agree) e.agree = 1;
    if (!a.research) e.research = 1;
    const el = eligibility(); if (el && !el.ok) e.elig = 1;
    S.errors = e;
    if (Object.keys(e).length) { render(); const x = app.querySelector(".err"); if (x) x.scrollIntoView({ block: "center" }); return; }
    startSurvey();
  });

  // ── 시작 ──
  (async function boot() {
    const d = store.get();
    if (MODE === "pre") {
      if (d && d.screen === "survey") { S.pos = d.pos || 0; S.screen = "resume"; S._draft = d; }
      else if (d && d.apply) S.apply = d.apply;
      render(); return;
    }
    if (DEMO) { S.name = ""; S.screen = d && d.screen === "survey" ? "resume" : "postWelcome"; if (d) S.pos = d.pos || 0; render(); return; }
    render();
    try {
      const r = await api({ action: "postInfo", token });
      if (!r.ok) { S.screen = "invalid"; }
      else {
        S.name = r.name || "";
        if (r.done) { S.result = r.result; S.revisit = true; }
        S.screen = r.done ? "change" : !r.open ? "notyet" : d && d.screen === "survey" ? "resume" : d && d.screen === "sat" ? "sat" : "postWelcome";
        if (d && S.screen !== "postWelcome") Object.assign(S, { pos: d.pos || 0, sat: d.sat || {}, satOpen: d.satOpen || {}, ans: d.ans || {}, helper: d.helper || "", t0: d.t0 || Date.now(), secIntro: d.secIntro !== false });
        if (S.screen === "resume") S.screen = "resume";
      }
    } catch (e) { S.screen = "invalid"; }
    render();
  })();
})();
</script>
</body>
</html>
