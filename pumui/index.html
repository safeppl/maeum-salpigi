<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>품의서·지출결의서 관리</title>
    <style>
      body { font-family: 'Noto Sans KR', sans-serif; max-width: 860px; margin: 32px auto; padding: 0 16px; color: #222; }
      h1 { font-size: 22px; }
      h2 { font-size: 18px; margin-top: 32px; }
      .확인 { color: #666; font-size: 13px; }
      label { display: block; font-size: 14px; margin-top: 12px; }
      input, select { font: inherit; padding: 6px; box-sizing: border-box; }
      .칸 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 16px; }
      .칸 input, .칸 select { width: 100%; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      th, td { border: 1px solid #ccc; padding: 4px; text-align: left; font-size: 14px; }
      td input, td select { width: 100%; }
      .금액 { text-align: right; }
      button { font: inherit; padding: 8px 16px; margin-top: 12px; cursor: pointer; }
      #결재선, #알림 { margin-top: 12px; padding: 8px 12px; background: #f5f5f5; white-space: pre-line; }
      #알림.오류 { background: #fdecea; color: #a00; }
      #알림.성공 { background: #e8f5e9; color: #1b5e20; }
      #알림:empty, #결재선:empty { display: none; }
      .문서 { border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
      .문서 .머리 { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
      .문서 .상태 { font-weight: bold; }
      .문서 .반려 { color: #a00; }
      .문서 button { margin: 8px 8px 0 0; padding: 4px 12px; }
      .문서 table { margin-top: 6px; }
      details.문서 { padding: 0; }
      details.문서 > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: 78px 1fr auto auto 10px; gap: 6px; align-items: center; font-size: 14px; }
      details.문서 > summary::-webkit-details-marker { display: none; }
      details.문서 > summary::after { content: '▾'; color: #888; }
      details.문서[open] > summary::after { content: '▴'; }
      details.문서 > summary .내용 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      details.문서 > .본문 { padding: 0 12px 10px; border-top: 1px solid #eee; }
      .배지 { font-size: 12px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
      .배지.대기 { background: #fff4e5; color: #8a4b00; }
      .배지.완료 { background: #e8f5e9; color: #1b5e20; }
      .배지.반려 { background: #fdecea; color: #a00; }
      .배지.임시 { background: #eee; color: #555; }
      #서명창 { max-width: 420px; width: calc(100% - 32px); border: 1px solid #ccc; border-radius: 8px; }
      #서명창 canvas { width: 100%; height: 160px; border: 1px dashed #999; border-radius: 6px; background: #fff; touch-action: none; display: block; }
      #서명창 img { max-width: 100%; max-height: 90px; border: 1px solid #eee; display: block; margin: 6px 0; }
      #서명창 .버튼줄 { display: flex; flex-wrap: wrap; gap: 8px; }
    </style>
  </head>
  <body>
    <h1 id="인사">품의서·지출결의서 관리</h1>
    <p id="안내" class="확인">불러오는 중…</p>
    <button type="button" id="내서명버튼" hidden onclick="내서명열기()">내 서명</button>

    <dialog id="서명창">
      <h3 id="서명제목" style="margin-top:0"></h3>
      <div id="등록서명칸" hidden>
        <p class="확인" style="margin:0">등록된 내 서명</p>
        <img id="등록서명그림" alt="등록된 서명">
        <button type="button" id="등록서명진행">등록된 서명으로 진행</button>
        <p class="확인" style="margin:16px 0 0">또는 아래에 새로 그리기</p>
      </div>
      <p class="확인" id="그리기안내" style="margin:4px 0">손가락이나 마우스로 서명하세요.</p>
      <canvas id="서명패드"></canvas>
      <label id="등록체크줄"><input type="checkbox" id="내서명으로등록" style="width:auto"> 이 서명을 내 서명으로 등록(다음부터 바로 사용)</label>
      <div class="버튼줄">
        <button type="button" id="그린서명진행">그린 서명으로 진행</button>
        <button type="button" onclick="서명패드비우기()">지우기</button>
        <button type="button" onclick="서명창닫기(null)">취소</button>
      </div>
    </dialog>

    <div id="앱" hidden>
    <section id="결재할영역" hidden>
      <h2>결재할 문서</h2>
      <div id="결재할목록"></div>
    </section>

    <section id="결재한영역" hidden>
      <h2>내가 결재한 문서</h2>
      <div id="결재한목록"></div>
    </section>

    <h2>내 문서</h2>
    <div id="내목록"><p class="확인">불러오는 중…</p></div>

    <h2 id="폼제목">품의서 작성 — 구매 및 집행</h2>
    <form id="품의서" onsubmit="저장(event)">
      <div class="칸">
        <label>기관
          <select name="기관" required onchange="결재선보기(this.value)">
            <option value="">선택</option>
          </select>
        </label>
        <label>사업명
          <input name="사업명" list="사업목록" maxlength="50" required placeholder="목록에서 고르거나 직접 입력">
          <datalist id="사업목록"></datalist>
        </label>
        <label>품의일자 <input type="date" name="품의일자" required></label>
        <label>지급일자 <input type="date" name="지급일자" required></label>
        <label>지급기한 <input type="date" name="지급기한" required></label>
        <label>지급방법
          <select name="지급방법" required></select>
        </label>
        <label>부가세
          <select name="부가세" required></select>
        </label>
      </div>
      <div id="결재선"></div>

      <table>
        <thead><tr><th>항목(계정)</th><th>금액(원)</th><th>비고</th><th>재원</th><th></th></tr></thead>
        <tbody id="내역"></tbody>
        <tfoot><tr><th>합계</th><th class="금액" id="합계">0</th><th colspan="3"></th></tr></tfoot>
      </table>
      <button type="button" onclick="줄추가()">+ 줄 추가</button>

      <div>
        <button type="submit" id="저장버튼">임시저장</button>
        <button type="button" id="새로작성버튼" onclick="새로작성()" hidden>수정 취소 · 새로 작성</button>
      </div>
      <div id="알림"></div>
    </form>

    <template id="줄양식">
      <tr>
        <td><select data-칸="계정" required><option value="">선택</option></select></td>
        <td><input data-칸="금액" type="number" min="1" step="1" class="금액" required oninput="합계계산()"></td>
        <td><input data-칸="비고" maxlength="100" placeholder="거래처/내용"></td>
        <td><select data-칸="재원" required></select></td>
        <td><button type="button" onclick="줄삭제(this)" aria-label="줄 삭제">삭제</button></td>
      </tr>
    </template>

      <section id="목록관리" hidden>
        <h2>목록 관리 <span class="확인">(사무국장만)</span></h2>
        <p class="확인">한 줄에 하나씩 씁니다. 줄을 추가하면 추가, 글자를 고치면 수정, 줄을 지우면 삭제됩니다. 이미 작성된 문서는 원래 이름 그대로 남습니다.</p>
        <div class="칸">
          <label>사업명 <textarea id="사업목록입력" rows="12" style="width:100%;font:inherit"></textarea></label>
          <label>항목(계정) <textarea id="계정목록입력" rows="12" style="width:100%;font:inherit"></textarea></label>
        </div>
        <button type="button" id="목록저장버튼" onclick="목록저장하기()">목록 저장</button>
        <span id="목록알림" class="확인"></span>
      </section>
    </div>

    <script>
      // ── 서버 연결 ── 화면은 GitHub Pages, 데이터는 Apps Script 웹앱(소유자 권한 실행)이 처리한다.
      // 사람마다 받은 전용 링크(?t=…)의 토큰을 요청마다 보내고, 서버가 사용자 시트와 맞춰 누구인지 정한다.
      const 서버주소 = 'https://script.google.com/macros/s/AKfycbxQEvkyT2n7Mu7nUTamBLvIO5k2Ny-DLUCCYPw4FXEvdNqQY33NN4V7v8TSQWelQHTz/exec';
      const 토큰 = new URLSearchParams(location.search).get('t') || '';

      /** 예전 google.script.run과 같은 모양으로 서버 함수를 부른다: 서버실행().withSuccessHandler(f).withFailureHandler(g).함수(인자…) */
      function 서버실행() {
        let 성공 = () => {}, 실패 = () => {};
        const 호출 = new Proxy({}, {
          get: (_, 이름) => {
            if (이름 === 'withSuccessHandler') return (f) => { 성공 = f; return 호출; };
            if (이름 === 'withFailureHandler') return (f) => { 실패 = f; return 호출; };
            return (...인자) => 서버보내기(이름, 인자).then(성공, 실패);
          },
        });
        return 호출;
      }

      async function 서버보내기(함수, 인자, 남은재시도 = 2) {
        let 결과;
        try {
          // text/plain으로 보내야 브라우저가 사전요청(CORS preflight) 없이 바로 보낸다.
          const 응답 = await fetch(서버주소, { method: 'POST', body: JSON.stringify({ 토큰, 함수, 인자 }) });
          결과 = await 응답.json();
        } catch (e) {
          if (남은재시도 > 0) return 서버보내기(함수, 인자, 남은재시도 - 1); // 첫 요청이 가끔 끊기는 Apps Script 특성
          throw new Error('서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.');
        }
        if (결과.성공) return 결과.값;
        throw new Error(결과.오류);
      }

      function 옵션채우기(선택칸, 값들, 기본값) {
        값들.forEach((v) => { const o = new Option(v, v, v === 기본값, v === 기본값); 선택칸.append(o); });
      }

      /** 첫 화면을 그린다. */
      function 시작() {
        document.getElementById('안내').textContent = '불러오는 중…';
        서버실행()
          .withSuccessHandler((정보) => {
            const 사용자 = 정보.사용자;
            결재자인가 = 사용자.역할 !== '기안자';
            document.getElementById('목록관리').hidden = !(사용자.역할 === '검토자' || 사용자.역할 === '관리자');
            document.getElementById('인사').textContent = `안녕하세요, ${사용자.이름}님`;
            document.getElementById('안내').textContent = `역할: ${사용자.역할}${사용자.기관 ? ` (${사용자.기관})` : ''}`;
            if (!화면준비됨) 화면준비(정보);
            document.getElementById('내서명버튼').hidden = false;
            서버실행().withSuccessHandler((그림) => { 내서명 = 그림; }).내서명조회();
            document.getElementById('앱').hidden = false;
            결재함새로고침();
          })
          .withFailureHandler((e) => { document.getElementById('안내').textContent = e.message; })
          .초기정보();
      }

      let 화면준비됨 = false;
      let 결재자인가 = false; // 검토자·최종결재자·관리자는 결재할 문서가 없어도 그 칸을 늘 보여 준다
      let 오늘 = '';
      function 화면준비(정보) {
        화면준비됨 = true;
        오늘 = 정보.오늘;
        const 폼 = document.getElementById('품의서');
        옵션채우기(폼.elements.기관, 정보.목록.기관);
        옵션채우기(폼.elements.지급방법, 정보.목록.지급방법목록);
        옵션채우기(폼.elements.부가세, 정보.목록.부가세목록);
        const 양식 = document.getElementById('줄양식').content;
        옵션채우기(양식.querySelector('[data-칸="재원"]'), 정보.목록.재원목록, '자부담');
        목록적용(정보.목록);
        새로작성();
      }

      /** 사업명 추천 목록과 항목(계정) 선택지를 바꾼다. 이미 고른 값은 목록에서 빠졌어도 그대로 둔다. */
      function 목록적용(목록) {
        document.getElementById('사업목록').replaceChildren(...목록.사업목록.map((v) => new Option(v)));
        const 계정칸들 = [document.getElementById('줄양식').content.querySelector('[data-칸="계정"]'), ...표.querySelectorAll('[data-칸="계정"]')];
        계정칸들.forEach((칸) => {
          const 고른값 = 칸.value;
          칸.replaceChildren(new Option('선택', ''));
          옵션채우기(칸, 목록.계정목록);
          if (고른값 && !목록.계정목록.includes(고른값)) 칸.append(new Option(고른값, 고른값));
          칸.value = 고른값;
        });
        document.getElementById('사업목록입력').value = 목록.사업목록.join('\n');
        document.getElementById('계정목록입력').value = 목록.계정목록.join('\n');
      }

      function 목록저장하기() {
        const 줄들 = (id) => document.getElementById(id).value.split('\n');
        const 버튼 = document.getElementById('목록저장버튼');
        const 알림칸 = document.getElementById('목록알림');
        버튼.disabled = true; 알림칸.textContent = '저장 중…';
        서버실행()
          .withSuccessHandler((목록) => { 버튼.disabled = false; 목록적용(목록); 알림칸.textContent = `저장했습니다. 사업명 ${목록.사업목록.length}개, 항목 ${목록.계정목록.length}개`; })
          .withFailureHandler((e) => { 버튼.disabled = false; 알림칸.textContent = ''; alert(e.message); })
          .목록저장(줄들('사업목록입력'), 줄들('계정목록입력'));
      }

      if (토큰) 시작();
      else document.getElementById('안내').textContent = '전용 링크로 접속하세요. 링크가 없으면 관리자에게 요청하세요.';

      const 최대줄 = 12;
      const 표 = document.getElementById('내역');

      function 줄추가() {
        if (표.rows.length >= 최대줄) return 알림('지출내역은 최대 12줄입니다.', '오류');
        표.appendChild(document.getElementById('줄양식').content.cloneNode(true));
      }
      function 줄삭제(버튼) {
        if (표.rows.length > 1) 버튼.closest('tr').remove();
        합계계산();
      }
      function 합계계산() {
        const 합 = [...표.querySelectorAll('[data-칸="금액"]')].reduce((s, el) => s + (Number(el.value) || 0), 0);
        document.getElementById('합계').textContent = 합.toLocaleString('ko-KR');
      }
      function 알림(글, 종류) {
        const 칸 = document.getElementById('알림');
        칸.textContent = 글;
        칸.className = 종류 || '';
      }
      function 결재선보기(기관) {
        const 칸 = document.getElementById('결재선');
        칸.textContent = '';
        if (!기관) return;
        서버실행()
          .withSuccessHandler((선) => { 칸.textContent = '결재선: ' + 선.map((s) => `${s.직함} ${s.이름}`).join(' → '); })
          .withFailureHandler((e) => { 칸.textContent = e.message; })
          .결재선조회(기관);
      }
      let 수정중번호 = '';

      function 저장(이벤트) {
        이벤트.preventDefault();
        const 폼 = 이벤트.target;
        const 입력 = Object.fromEntries(new FormData(폼));
        입력.내역 = [...표.rows].map((tr) => Object.fromEntries(
          [...tr.querySelectorAll('[data-칸]')].map((el) => [el.dataset.칸, el.value])));
        const 버튼 = document.getElementById('저장버튼');
        버튼.disabled = true;
        알림('저장 중입니다…');
        서버실행()
          .withSuccessHandler((번호) => {
            버튼.disabled = false;
            새로작성();
            알림(`임시저장되었습니다. 문서번호: ${번호}\n'내 문서'에서 상신하세요.`, '성공');
            결재함새로고침();
          })
          .withFailureHandler((e) => { 버튼.disabled = false; 알림(e.message, '오류'); })
          .품의임시저장(입력, 수정중번호);
      }

      /** 폼을 비우고 새 문서 작성 상태로 되돌린다. */
      function 새로작성() {
        수정중번호 = '';
        const 폼 = document.getElementById('품의서');
        폼.reset();
        ['품의일자', '지급일자', '지급기한'].forEach((칸) => { 폼.elements[칸].value = 오늘; });
        표.innerHTML = '';
        줄추가();
        합계계산();
        결재선보기('');
        document.getElementById('폼제목').textContent = '품의서 작성 — 구매 및 집행';
        document.getElementById('새로작성버튼').hidden = true;
        알림('');
      }

      /** 내 문서의 내용을 폼에 채워 고칠 수 있게 한다. */
      function 수정하기(문서) {
        새로작성();
        수정중번호 = 문서.문서번호;
        const 폼 = document.getElementById('품의서');
        ['기관', '사업명', '품의일자', '지급일자', '지급기한', '지급방법', '부가세'].forEach((칸) => { 폼.elements[칸].value = 문서[칸]; });
        표.innerHTML = '';
        문서.내역.forEach((줄) => {
          줄추가();
          const tr = 표.rows[표.rows.length - 1];
          tr.querySelectorAll('[data-칸]').forEach((el) => { el.value = 줄[el.dataset.칸] === undefined ? '' : 줄[el.dataset.칸]; });
        });
        합계계산();
        결재선보기(문서.기관);
        document.getElementById('폼제목').textContent = `품의서 수정 — ${문서.문서번호}`;
        document.getElementById('새로작성버튼').hidden = false;
        폼.scrollIntoView({ behavior: 'smooth' });
      }

      /** 태그를 만든다. 사용자가 입력한 글자는 textContent로만 넣어 화면에 코드가 끼어들지 못하게 한다. */
      function 요소(태그, 글자, 클래스) {
        const el = document.createElement(태그);
        if (글자 !== undefined) el.textContent = 글자;
        if (클래스) el.className = 클래스;
        return el;
      }

      const 원 = (n) => Number(n).toLocaleString('ko-KR') + '원';

      function 결재선글(문서) {
        if (!문서.결재선) return '결재선 없음(기관 확인 필요)';
        return 문서.결재선.map((s) => `${s.직함} ${s.이름}`).join(' → ');
      }

      /** 화면에 보이는 상태 이름: 검토대기·최종결재대기 → 결재 대기, 승인 → 결재 완료 */
      function 상태표시(상태) {
        if (상태 === '검토대기') return ['결재 대기(사무국장)', '대기'];
        if (상태 === '최종결재대기') return ['결재 대기(최종)', '대기'];
        if (상태 === '승인') return ['결재 완료', '완료'];
        if (상태 === '반려') return ['반려', '반려'];
        return [상태, '임시'];
      }

      /** 한 줄 요약(품의일자 · 내용 · 금액 · 상태)을 누르면 자세한 내용이 펼쳐진다. */
      function 문서카드(문서, 펼침) {
        const 접이 = 요소('details', undefined, '문서');
        접이.open = !!펼침;
        const 요약 = 요소('summary');
        const 첫항목 = 문서.내역[0] ? 문서.내역[0].계정 + (문서.내역.length > 1 ? ` 외 ${문서.내역.length - 1}건` : '') : '';
        const [상태글, 상태종류] = 상태표시(문서.상태);
        요약.append(
          요소('span', 문서.품의일자, '확인'),
          요소('span', `${문서.사업명} · ${첫항목}`, '내용'),
          요소('span', 원(문서.합계)),
          요소('span', 상태글, '배지 ' + 상태종류),
        );
        const 카드 = 요소('div', undefined, '본문');
        접이.append(요약, 카드);
        const 머리 = 요소('div', undefined, '머리');
        머리.append(
          요소('span', 문서.상태, '상태'),
          요소('span', 문서.문서번호),
          요소('span', `${문서.기관} · ${문서.사업명}`),
          요소('span', 원(문서.합계)),
          요소('span', `기안 ${문서.기안자이름} · 품의일자 ${문서.품의일자}`, '확인'),
        );
        카드.append(머리, 요소('div', '결재선: ' + 결재선글(문서), '확인'));
        if (문서.상태 === '반려' && 문서.반려사유) 카드.append(요소('div', '반려 사유: ' + 문서.반려사유, '반려'));

        const 표내역 = 요소('table');
        const 머리줄 = 요소('tr');
        ['항목', '금액', '비고', '재원'].forEach((h) => 머리줄.append(요소('th', h)));
        표내역.append(머리줄);
        문서.내역.forEach((줄) => {
          const tr = 요소('tr');
          tr.append(요소('td', 줄.계정), 요소('td', 원(줄.금액), '금액'), 요소('td', 줄.비고 || ''), 요소('td', 줄.재원));
          표내역.append(tr);
        });
        카드.append(표내역);

        if (문서.결재이력.length) {
          카드.append(요소('div', 문서.결재이력.map((r) => `${r.일시} ${r.이름} ${r.동작}${r.사유 ? ` (${r.사유})` : ''}`).join('\n'), '확인'));
          카드.lastChild.style.whiteSpace = 'pre-line';
        }

        const 출력버튼 = 요소('button', '출력(엑셀·PDF)');
        출력버튼.type = 'button';
        출력버튼.onclick = () => 출력(문서, 출력버튼);
        카드.append(출력버튼);

        문서.가능동작.forEach((동작) => {
          const 버튼 = 요소('button', 동작);
          버튼.type = 'button';
          버튼.onclick = () => (동작 === '수정' ? 수정하기(문서) : 처리(문서, 동작, 버튼));
          카드.append(버튼);
        });
        return 접이;
      }

      async function 처리(문서, 동작, 버튼) {
        let 사유 = '';
        let 서명 = '';
        if (동작 === '반려') {
          사유 = prompt(`${문서.문서번호} 반려 사유를 입력하세요.`);
          if (사유 === null) return;
        } else {
          // 상신·승인은 결재란에 들어갈 서명을 받는다
          const 선택 = await 서명받기(`${문서.문서번호} ${동작}`, true);
          if (!선택) return;
          서명 = 선택.서명;
          if (선택.등록) {
            try { await 서버보내기('내서명저장', [서명]); 내서명 = 서명; } catch (e) { alert('내 서명 등록은 실패했지만 결재는 계속합니다: ' + e.message); }
          }
        }
        버튼.disabled = true;
        서버실행()
          .withSuccessHandler((상태) => { alert(`${문서.문서번호}: ${상태}`); 결재함새로고침(); })
          .withFailureHandler((e) => { 버튼.disabled = false; alert(e.message); })
          .문서처리(문서.문서번호, 동작, 사유, 서명);
      }

      // ── 서명 ── 내 서명을 한 번 등록해 두고 쓰거나, 결재할 때마다 새로 그린다.
      let 내서명 = '';
      let 서명됨 = false;
      let 서명창결과 = null;
      const 패드 = document.getElementById('서명패드');

      function 서명패드비우기() {
        const r = window.devicePixelRatio || 1;
        패드.width = Math.round(패드.clientWidth * r); 패드.height = Math.round(패드.clientHeight * r);
        const c = 패드.getContext('2d'); // 투명 바탕: 양식 결재란에 얹을 때 칸 테두리가 가려지지 않게
        c.lineWidth = 2.5 * r; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#000';
        서명됨 = false;
      }
      (() => {
        let 그리는중 = false;
        const 위치 = (e) => { const b = 패드.getBoundingClientRect(), r = 패드.width / b.width; return [(e.clientX - b.left) * r, (e.clientY - b.top) * r]; };
        패드.addEventListener('pointerdown', (e) => { 그리는중 = true; 패드.setPointerCapture(e.pointerId); const c = 패드.getContext('2d'); c.beginPath(); c.moveTo(...위치(e)); });
        패드.addEventListener('pointermove', (e) => { if (!그리는중) return; const c = 패드.getContext('2d'); c.lineTo(...위치(e)); c.stroke(); 서명됨 = true; });
        ['pointerup', 'pointercancel'].forEach((t) => 패드.addEventListener(t, () => { 그리는중 = false; }));
      })();

      /** 서명 창을 열고 { 서명: '등록서명' | 그림, 등록: true/false } 또는 취소 시 null을 돌려준다. */
      function 서명받기(제목, 결재용) {
        const 창 = document.getElementById('서명창');
        document.getElementById('서명제목').textContent = 제목;
        document.getElementById('등록서명칸').hidden = !내서명;
        document.getElementById('등록서명진행').hidden = !결재용;
        document.getElementById('등록서명그림').src = 내서명 || '';
        document.getElementById('등록체크줄').hidden = !결재용;
        document.getElementById('내서명으로등록').checked = !내서명; // 아직 등록 안 했으면 기본으로 등록
        document.getElementById('그린서명진행').textContent = 결재용 ? '그린 서명으로 진행' : '이 서명을 내 서명으로 저장';
        창.showModal();
        서명패드비우기();
        return new Promise((끝) => { 서명창결과 = 끝; });
      }
      function 서명창닫기(값) {
        document.getElementById('서명창').close();
        if (서명창결과) { const 끝 = 서명창결과; 서명창결과 = null; 끝(값); }
      }
      document.getElementById('서명창').addEventListener('cancel', () => 서명창닫기(null)); // Esc
      document.getElementById('등록서명진행').onclick = () => 서명창닫기({ 서명: '등록서명', 등록: false });
      document.getElementById('그린서명진행').onclick = () => {
        if (!서명됨) return alert('서명을 그려 주세요.');
        서명창닫기({ 서명: 패드.toDataURL('image/png'), 등록: document.getElementById('내서명으로등록').checked });
      };

      async function 내서명열기() {
        const 선택 = await 서명받기(내서명 ? '내 서명 바꾸기' : '내 서명 등록', false);
        if (!선택) return;
        try { await 서버보내기('내서명저장', [선택.서명]); 내서명 = 선택.서명; alert('내 서명을 저장했습니다.'); } catch (e) { alert(e.message); }
      }

      /** base64 파일을 내려받는 링크를 만든다. 크롬이 자동 연속 다운로드를 막으므로 사용자가 직접 누르게 한다. */
      function 받기링크(base64, 파일이름, 형식, 글) {
        const 링크 = 요소('a', 글);
        링크.href = `data:${형식};base64,${base64}`;
        링크.download = 파일이름;
        링크.style.marginLeft = '8px';
        return 링크;
      }

      function 출력(문서, 버튼) {
        버튼.disabled = true;
        버튼.textContent = '만드는 중…';
        const 끝 = () => { 버튼.disabled = false; 버튼.textContent = '출력(엑셀·PDF)'; };
        서버실행()
          .withSuccessHandler((파일) => {
            버튼.nextElementSibling?.classList.contains('받기') && 버튼.nextElementSibling.remove();
            const 묶음 = 요소('span', '', '받기');
            묶음.append(
              받기링크(파일.xlsx, 파일.이름 + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', '엑셀 받기'),
              받기링크(파일.pdf, 파일.이름 + '.pdf', 'application/pdf', 'PDF 받기'),
            );
            버튼.after(묶음);
            끝();
          })
          .withFailureHandler((e) => { 끝(); alert(e.message); })
          .품의서출력(문서.문서번호);
      }

      function 목록그리기(칸, 문서들, 빈글, 펼침) {
        칸.replaceChildren(...(문서들.length ? 문서들.map((d) => 문서카드(d, 펼침)) : [요소('p', 빈글, '확인')]));
      }

      function 결재함새로고침() {
        서버실행()
          .withSuccessHandler((결과) => {
            document.getElementById('결재할영역').hidden = !결재자인가 && 결과.결재할문서.length === 0;
            목록그리기(document.getElementById('결재할목록'), 결과.결재할문서, '지금 결재할 문서가 없습니다.', true);
            document.getElementById('결재한영역').hidden = !결재자인가 && 결과.결재한문서.length === 0;
            목록그리기(document.getElementById('결재한목록'), 결과.결재한문서, '아직 결재한 문서가 없습니다.');
            목록그리기(document.getElementById('내목록'), 결과.내문서, '작성한 문서가 없습니다.');
          })
          .withFailureHandler((e) => { document.getElementById('내목록').replaceChildren(요소('p', e.message, '반려')); })
          .결재함조회();
      }

    </script>
  </body>
</html>
