<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위드워킹 동행활동보고서</title>
<style>
  :root { --teal:#2C6765; --orange:#D68B47; --bg:#EDF1EC; --text:#1E2A2B; --muted:#5A6968; --border:#D2DAD3; }
  * { box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  .card { background:#fff; border-radius:12px; padding:16px; margin-top:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  select, input, textarea { width:100%; font:inherit; font-size:15px; padding:10px; border:1px solid var(--border); border-radius:8px; margin-top:4px; background:#fff; }
  label { display:block; margin-top:14px; font-weight:600; font-size:14px; }
  .sub { font-weight:400; color:var(--muted); font-size:12px; margin-top:2px; }
  .row2 { display:flex; gap:8px; }
  .row2 > * { flex:1; }
  button { width:100%; margin-top:20px; background:var(--teal); color:#fff; font-size:16px; font-weight:700; padding:14px; border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .infoBtn { width:auto; display:inline-block; padding:2px 7px; margin:0 0 0 4px; font-size:13px; font-weight:700; border-radius:50%; background:var(--bg); color:var(--teal); border:1px solid var(--border); cursor:pointer; vertical-align:middle; }
  .rubric { background:var(--bg); border-radius:8px; padding:8px 10px; margin-top:6px; }
  .rubric p { margin:4px 0; font-size:12.5px; color:var(--muted); font-weight:400; }
  .scale { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .scale button { flex:1 1 47%; margin:0; padding:10px 4px; background:#fff; color:var(--text); border:1px solid var(--border); font-size:12.5px; font-weight:500; }
  .scale button.sel { background:var(--orange); color:#fff; border-color:var(--orange); }
  #msg { margin-top:14px; font-weight:600; }
  #loading, #done { text-align:center; padding:40px 0; color:var(--muted); }
</style>
</head>
<body>
<div id="loading">불러오는 중이에요…</div>
<div id="app" style="display:none">
  <h1 id="hello"></h1>
  <p class="muted">회차별 동행활동보고서를 작성해 주세요. <button type="button" id="myReportsBtn" style="width:auto;display:inline;background:none;border:none;color:var(--teal);text-decoration:underline;font-size:13px;padding:0;margin:0">내 보고서 목록</button></p>

  <div id="myReports" class="card" style="display:none"></div>

  <div id="formCard" class="card">
    <p class="muted" id="editingHint" style="display:none"></p>
    <div id="pickerFields">
    <label>참여자<span class="sub">누구와 함께한 활동인가요</span></label>
    <select id="code"></select>

    <label>회차<span class="sub" id="trackHint"></span></label>
    <select id="round"></select>
    </div>
    <label><input type="checkbox" id="finalize" style="width:auto;display:inline-block;margin-right:6px"> 이번 회차로 활동 종결(10회 또는 15회 활동인지 확인 후 체크할 것! 체크하면 참여자와 동행활동이 종료 처리되니 유의하세요!)</label>

    <label>대면 시 활동 내용<span class="sub" id="faceActsSub">대상자와 활동한 내용들을 모두 체크해 주세요!</span></label>
    <div id="faceActs"></div>
    <input id="faceActEtc" placeholder="기타(직접 입력, 없으면 비워두세요)">

    <label>대면활동 — 날짜</label>
    <input id="faceDate" type="date">
    <p class="sub" id="faceDayHint" style="margin-top:2px"></p>
    <label>대면활동 — 시간</label>
    <select id="faceTime"></select>
    <label>대면활동 — 장소</label>
    <input id="facePlace" placeholder="예: OO동 카페, 도서관 등(구체적 상호명은 적지 말아주세요)">
    <label>대면활동 — 소통 내용<span class="sub">개조식으로 5문장 이하</span></label>
    <textarea id="faceTalk" rows="3" placeholder="나눈 이야기, 활동 내용을 개조식으로 5문장 이하로 적어주세요"></textarea>
    <label>사진<span class="sub">선택 — 대표 사진 1장</span></label>
    <input id="facePhoto" type="file" accept="image/*">
    <label>특이사항</label>
    <textarea id="faceNote" rows="2"></textarea>
  </div>

  <div class="card">
    <label>비대면 연락 1 — 날짜</label>
    <input id="remote1Date" type="date">
    <p class="sub" id="remote1DayHint" style="margin-top:2px"></p>
    <div class="row2">
      <div><label style="margin-top:0">시간</label><select id="remote1Time"></select></div>
      <div><label style="margin-top:0">수단</label><input id="remote1How" placeholder="예: 전화, 문자"></div>
    </div>
    <label>비대면 연락 1 — 내용</label>
    <textarea id="remote1Talk" rows="2"></textarea>
    <label>비대면 연락 2 — 날짜<span class="sub">없으면 비워두세요</span></label>
    <input id="remote2Date" type="date">
    <p class="sub" id="remote2DayHint" style="margin-top:2px"></p>
    <div class="row2">
      <div><label style="margin-top:0">시간</label><select id="remote2Time"></select></div>
      <div><label style="margin-top:0">수단</label><input id="remote2How" placeholder="예: 전화, 문자"></div>
    </div>
    <label>비대면 연락 2 — 내용</label>
    <textarea id="remote2Talk" rows="2"></textarea>
  </div>

  <div class="card">
    <label>이후 활동계획 — 대면</label>
    <textarea id="nextFace" rows="2"></textarea>
    <label>이후 활동계획 — 비대면</label>
    <textarea id="nextRemote" rows="2"></textarea>
    <div id="schedBox">
      <label>다음 일정 등록<span class="sub" id="schedHint" style="display:block;color:var(--orange)"></span><span class="sub">적으면 사업 스케줄표의 그 날짜 칸에 자동으로 적혀요(예: 대) 홍길동-아무개 19시(2회차), 비) 홍길동-아무개 19시(2회차 1차)). 정해지지 않았으면 비워두세요.</span></label>
      <div class="row2">
        <div><label style="margin-top:0">다음 대면 — 날짜</label><input id="nextFaceDate" type="date"></div>
        <div><label style="margin-top:0">시간</label><select id="nextFaceTime"></select></div>
      </div>
      <div class="row2">
        <div><label style="margin-top:0">비대면 1차(대면 전) — 날짜</label><input id="nextRemote1Date" type="date"></div>
        <div><label style="margin-top:0">시간</label><select id="nextRemote1Time"></select></div>
      </div>
      <div class="row2">
        <div><label style="margin-top:0">비대면 2차(대면 후) — 날짜</label><input id="nextRemote2Date" type="date"></div>
        <div><label style="margin-top:0">시간</label><select id="nextRemote2Time"></select></div>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="muted" style="margin:0 0 4px">참여자 반응 변화 체크(척도) — 해당하는 만큼만 체크해도 돼요</p>
    <div id="scaleItems"></div>
  </div>

  <div class="card">
    <p class="muted" style="margin:0 0 4px"><span id="signWho">활동가</span> 서명 — 손가락(또는 마우스)으로 서명해 주세요 <button type="button" id="signClear" style="width:auto;padding:2px 10px;margin-left:6px">지우기</button></p>
    <canvas id="signPad" style="width:100%;height:150px;border:1px dashed #999;border-radius:8px;background:#fff;touch-action:none"></canvas>
    <label><input type="checkbox" id="signAgree" style="width:auto;display:inline-block;margin-right:6px"> 위 내용이 사실임을 확인합니다</label>
  </div>

  <button id="submit">보고서 제출하기</button>
  <div id="msg"></div>
</div>
<div id="done" style="display:none">보고서를 제출했어요. 수고 많으셨어요!</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwj4uAvLD50QYSEvq2qV1zcz0ru-wQN33gxPKrMfh6QFF3UO9zH1SDOVH1ARbXt1xc/exec';
const token = new URLSearchParams(location.search).get('t') || '';

// 실제 "활동 보고서(신 척도)" 구글폼과 똑같은 15개 문항 — 서버(Code.gs)의 SCALE_ITEMS와 순서·문구가 같아야 해요.
const SCALE_ITEMS = [
  ['시선자세', '대화 시 시선을 맞추거나 편안한 신체 자세를 유지하는가?'],
  ['시간준수', '정해진 활동 시간을 준수하며, 변동 시 사전에 연락하여 조율하는가?'],
  ['의사표현', '자신의 의사를 명확히 표현하지 못하며 활동가와 원활한 소통이 원활하지 못 한가?'],
  ['수면리듬', '밤낮이 바뀐 생활이나 불규칙한 수면을 개선하는가?'],
  ['위생외모', '청결 상태(세안, 의복 등)를 유지하며 외모의 긍정적 변화를 시도하는가?'],
  ['활동반경', '방 외 다른 공간이나 장소로 활동 범위를 넓히고 있는가?'],
  ['욕구표현', '취미, 진로 등 자신이 하고 싶은 활동에 대해 구체적인 욕구를 드러내는가?'],
  ['자기가치', '타인의 기준이 아닌 자신만의 장점이나 가치를 스스로 발견하고 말하는가?'],
  ['자신감', '나도 할 수 있다는 자신감과 희망을 표현하는가?'],
  ['정서불안', '무기력, 불안, 우울의 표출과 정서적인 불안함이 보이는가?'],
  ['감정조절', '감정 기복이 있고 분노를 스스로 인지 못하거나 조절하지 못하는가?'],
  ['소통왜곡', '대면 소통 상황을 부정적으로 왜곡하고 있는 그대로 받아들이지 못하는가?'],
  ['신뢰관계', '활동가를 신뢰할 수 있는 타자로 인식하고 정서적 교감을 나누는가?'],
  ['가족관계', '주 양육자(부모)나 가족과의 갈등을 줄이고 소통을 시도하려는 변화가 있는가?'],
  ['타인소통', '타인과 마주치거나 소통하는 것이 원할한가?']
];
const SCALE_LEVELS = ['매우 그렇다', '그렇다', '그렇지 않다', '매우 그렇지 않다'];
const SCALE_SCORES_ = [4, 3, 2, 1]; // 기준표(ⓘ)의 점수와 맞춰서 버튼에 같이 표기 — 매우 그렇다=4점 ~ 매우 그렇지 않다=1점
// 동행활동가 양성과정 교안("4. 보고서작성요령.pptx")의 문항별 1~4점 행동기준표를 그대로 옮김(참고용 느낌표 안내).
const RUBRIC_ = {
  시선자세: ['시선회피/고개숙임', '필요시에만 시선마주침', '50% 이상 자연스러운 시선', '편안한 시선+반응확인'],
  시간준수: ['노쇼/직전취소', '매회지각/무연락', '정시도착노력+사전알림', '항상정시/5분전도착'],
  의사표현: ['자발적주제제안+논리적의견', '명확히표현', '최소문장답변', '단답/끄덕임만'],
  수면리듬: ['낮밤뒤바뀜지속', '주1-2회기상시도', '규칙적기상+자기점검', '규칙적기상취침+생산활동'],
  위생외모: ['불쾌체취/지저분', '외출복부분미흡', '기본청결유지', '깔끔단정'],
  활동반경: ['방밖안나옴', '거실등공용공간', '카페공원등외부', '장소제안+낯선환경편안'],
  욕구표현: ['무욕구상태', '수동적답변', '희망활동구체화', '자발적미션제안'],
  자기가치: ['미래희망없음', '강점탐색하나타인의존', '긍정적언급', '가치이해+다양성존중'],
  자신감: ['시도두려움/회피', '수월한미션완수', '성공후자신감표현', '성취축적+자발목표'],
  정서불안: ['논리적설명/여유', '불안거의없음', '지지로일시안정', '무기력/우울/불안관찰됨'],
  감정조절: ['완벽조절', '인지+적극성', '수시변화하나자기검열', '감정기복심함/무반응'],
  소통왜곡: ['피드백을보상으로인식', '공감+이성적수용', '일시적불만', '부정적/공격적해석'],
  신뢰관계: ['불신', '최소소통', '정서적교감+신뢰형성', '안전기지로내면화'],
  가족관계: ['갈등/단절', '제안을압박으로느낌', '경청+차분한표현', '대화증가+신뢰회복'],
  타인소통: ['타인접촉전혀없음', '생존용최소소통', '타인과소통증가', '집단활동자발참여']
};
const scaleVals = {};
SCALE_ITEMS.forEach(([key]) => { scaleVals[key] = null; });

const DOW_ = ['일', '월', '화', '수', '목', '금', '토'];
function dayOf(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return isNaN(d) ? '' : DOW_[d.getDay()] + '요일';
}
function timeOptions_() {
  const opts = [];
  for (let h = 6; h <= 23; h++) {
    for (const m of [0, 30]) {
      const hh = String(h).padStart(2, '0'), mm = String(m).padStart(2, '0');
      const ampm = h < 12 ? '오전' : '오후';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      opts.push({ value: hh + ':' + mm, label: ampm + ' ' + h12 + ':' + mm });
    }
  }
  return opts;
}
function fillTimeSelect_(id) {
  document.getElementById(id).innerHTML = timeOptions_().map(o => '<option value="' + o.value + '">' + o.label + '</option>').join('');
}
function bindDateHint_(dateId, hintId) {
  const dateEl = document.getElementById(dateId), hintEl = document.getElementById(hintId);
  dateEl.addEventListener('change', () => { hintEl.textContent = dayOf(dateEl.value); });
}
['faceTime', 'remote1Time', 'remote2Time', 'nextFaceTime', 'nextRemote1Time', 'nextRemote2Time'].forEach(fillTimeSelect_);

// 원본 구글폼 "대면 시 활동 내용" 보기와 같아야 해요(서버 Code.gs의 FACE_ACTIVITIES).
const REASON_ACTIVITIES = ['조언을 해주었음', '고민 해결을 위해 노력했음'];
const FACE_ACTIVITIES = ['초기 면접 과정을 숙지하고 상황을 이해했음', '원하는 장소로 이동했음', '자주 찾거나 익숙한 장소에서 대화했음',
  '이야기를 최대한 경청했음', '조언을 해주었음', '고민 해결을 위해 노력했음', '집까지 배웅 또는 가는 것을 끝까지 지켜봐 주었음'];
document.getElementById('faceActs').innerHTML = FACE_ACTIVITIES.map((a, i) =>
  '<label style="font-weight:400;margin-top:6px"><input type="checkbox" class="faceAct" value="' + a + '" style="width:auto;display:inline-block;margin-right:6px">' + a + '</label>' +
  (REASON_ACTIVITIES.indexOf(a) >= 0 ? '<textarea class="faceReason" data-act="' + a + '" rows="2" placeholder="어떤 내용이었는지 사유를 적어 주세요(필수)" style="display:none;margin-top:4px"></textarea>' : '')).join('');
// 2026-11-24: '조언'·'고민 해결'에 체크하면 사유 칸이 나타나요(서버 Code.gs의 REASON_ACTIVITIES_와 같아야 해요).
function syncReasonBoxes() {
  document.querySelectorAll('.faceReason').forEach(t => {
    const cb = [...document.querySelectorAll('.faceAct')].find(c => c.value === t.dataset.act);
    t.style.display = cb && cb.checked ? 'block' : 'none';
  });
}
document.querySelectorAll('.faceAct').forEach(cb => cb.addEventListener('change', syncReasonBoxes));
bindDateHint_('faceDate', 'faceDayHint');
bindDateHint_('remote1Date', 'remote1DayHint');
bindDateHint_('remote2Date', 'remote2DayHint');

function post(body) {
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json());
}

function rubricHtml_(key) {
  const r = RUBRIC_[key];
  if (!r) return '';
  return '<div class="rubric" id="rubric_' + key + '" style="display:none">' +
    r.map((t, i) => '<p>' + (i + 1) + '점 — ' + t + '</p>').join('') + '</div>';
}
function buildScaleItems() {
  const wrap = document.getElementById('scaleItems');
  wrap.innerHTML = SCALE_ITEMS.map(([key, q]) =>
    '<label><span class="q" data-q="' + q + '">' + q + '</span> <button type="button" class="infoBtn" data-key="' + key + '">ⓘ</button></label>' +
    rubricHtml_(key) +
    '<div class="scale" data-for="' + key + '"></div>' +
    '<textarea id="' + key + '_evidence" rows="2" placeholder="판단 근거(구체적 행동)"></textarea>'
  ).join('');
  wrap.querySelectorAll('.infoBtn').forEach(btn => btn.addEventListener('click', () => {
    const el = document.getElementById('rubric_' + btn.dataset.key);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }));
  SCALE_ITEMS.forEach(([key]) => {
    const el = wrap.querySelector('.scale[data-for="' + key + '"]');
    SCALE_LEVELS.forEach((level, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = level + ' (' + SCALE_SCORES_[i] + '점)';
      b.onclick = () => { scaleVals[key] = level; [...el.children].forEach(c => c.classList.remove('sel')); b.classList.add('sel'); };
      el.appendChild(b);
    });
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        const max = 1280;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale; canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const wrap = document.getElementById('myReports');

    (list.length ? '' : '<p class="muted">아직 제출한 보고서가 없어요.</p>');
  wrap.innerHTML = viewHtml + list.map((r, i) =>
    '<p class="muted" style="margin:8px 0">' + r.name + ' · ' + r.round + '회차 · ' + r.writtenAt +

async function viewDoc(code) {
  const msg = document.getElementById('viewMsg');
  const win = window.open('', '_blank'); // 휴대폰 팝업 차단을 피하려고 누르는 순간 창부터 열어둬요
  if (win) win.document.write('<p style="font-family:sans-serif;padding:20px">보고서를 불러오는 중이에요… (사진이 많으면 10초쯤 걸려요)</p>');
  msg.textContent = '불러오는 중이에요…';
  const res = await post({ action: 'viewMyDoc', token, code }).catch(() => ({ ok: false }));
  if (!res.ok) {
    msg.textContent = res.error === 'no_doc' ? '아직 초기면접지·보고서 문서가 없어요(첫 보고서를 제출하면 만들어져요).' : '불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
    if (win) win.close();

  }

  const r = res.report;

  set('faceDate', r['대면_날짜']); set('faceTime', r['대면_시간']); set('facePlace', r['대면_장소']);
  set('faceTalk', r['대면_소통내용']); set('faceNote', r['대면_특이사항']);
  set('remote1Date', r['비대면1_날짜']); set('remote1Time', r['비대면1_시간']); set('remote1How', r['비대면1_수단']); set('remote1Talk', r['비대면1_내용']);
  set('remote2Date', r['비대면2_날짜']); set('remote2Time', r['비대면2_시간']); set('remote2How', r['비대면2_수단']); set('remote2Talk', r['비대면2_내용']);
  set('nextFace', r['다음계획_대면']); set('nextRemote', r['다음계획_비대면']);
  const acts = String(r['대면_활동내용'] || '').split(', ');
  document.querySelectorAll('.faceAct').forEach(cb => { cb.checked = acts.indexOf(cb.value) >= 0; });
  const reasons = {};
  String(r['대면_활동사유'] || '').split('\n').forEach(line => { const i = line.indexOf(': '); if (i > 0) reasons[line.slice(0, i)] = line.slice(i + 2); });
  document.querySelectorAll('.faceReason').forEach(t => { t.value = reasons[t.dataset.act] || ''; });
  syncReasonBoxes();
  const etc = acts.find(a => a.indexOf('기타: ') === 0);
  set('faceActEtc', etc ? etc.slice(4) : '');
  // 다음 일정도 불러와 고칠 수 있어요 — 바꾸면 서버가 스케줄표의 예전 줄을 지우고 새로 적어요(중복 없음)
  const slot = v => { const m = String(v || '').match(/(\d{4}-\d{2}-\d{2})\s*(\d{1,2}:\d{2})?/); return m ? [m[1], m[2] || ''] : ['', '']; };
  const remoteParts = String(r['다음일정_비대면'] || '').split(' / ');
  const r1 = slot(remoteParts.find(x => x.trim() && x.trim().indexOf('2차') !== 0));
  const r2 = slot(remoteParts.find(x => x.trim().indexOf('2차') === 0));
  const f = slot(r['다음일정_대면']);
  const setSlot = (dId, tId, v) => { set(dId, v[0]); if (v[1]) set(tId, v[1]); };
  setSlot('nextFaceDate', 'nextFaceTime', f); setSlot('nextRemote1Date', 'nextRemote1Time', r1); setSlot('nextRemote2Date', 'nextRemote2Time', r2);
  document.getElementById('schedHint').textContent = '수정 중: 날짜·시간을 바꾸거나 지우면 스케줄표의 예전 일정은 자동으로 지우고 새로 적어요.';

  SCALE_ITEMS.forEach(([key]) => {

    set(key + '_evidence', r[key + '_근거']);
  });
  msg.textContent = '';
}

// 서명 패드: 한 획이라도 그어야 제출돼요. 흰 바탕 JPEG로 보내서 사진과 같은 방식으로 저장해요.
const signPad = document.getElementById('signPad');
// 서명 주변의 흰 여백을 잘라내 문서의 서명란에 크게/알맞게 들어가게 해요(패드 전체를 그대로 올리면 글씨가 작고 줄이 넘어가요)
function trimSignData_() {
  const w = signPad.width, hgt = signPad.height, d = signPad.getContext('2d').getImageData(0, 0, w, hgt).data;
  let x0 = w, y0 = hgt, x1 = -1, y1 = -1;
  for (let y = 0; y < hgt; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (d[i] < 235 || d[i + 1] < 235 || d[i + 2] < 235) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return signPad.toDataURL('image/jpeg', 0.8);
  const pad = 10;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(hgt - 1, y1 + pad);
  const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  const oc = out.getContext('2d'); oc.fillStyle = '#fff'; oc.fillRect(0, 0, out.width, out.height);
  oc.drawImage(signPad, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  // 흰 바탕을 투명하게(검은 정도만큼 불투명) — 문서에서 '텍스트 뒤'로 깔았을 때 글자를 가리지 않게 해요
  const id = oc.getImageData(0, 0, out.width, out.height), px = id.data;
  for (let i = 0; i < px.length; i += 4) { const a = 255 - Math.min(px[i], px[i + 1], px[i + 2]); px[i] = px[i + 1] = px[i + 2] = 0; px[i + 3] = a; }
  oc.putImageData(id, 0, 0);
  return out.toDataURL('image/png');
}
let signed = false;
function resetSign() {
  const r = window.devicePixelRatio || 1;
  signPad.width = Math.round(signPad.clientWidth * r); signPad.height = Math.round(signPad.clientHeight * r);
  const c = signPad.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, signPad.width, signPad.height);
  c.lineWidth = 2.5 * r; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#000';
  signed = false;
}
(() => {
  let drawing = false;
  const pos = e => { const b = signPad.getBoundingClientRect(), r = signPad.width / b.width; return [(e.clientX - b.left) * r, (e.clientY - b.top) * r]; };
  signPad.addEventListener('pointerdown', e => { if (!signed && signPad.width !== Math.round(signPad.clientWidth * (window.devicePixelRatio || 1))) resetSign(); drawing = true; signPad.setPointerCapture(e.pointerId); const c = signPad.getContext('2d'); c.beginPath(); c.moveTo(...pos(e)); });
  signPad.addEventListener('pointermove', e => { if (!drawing) return; const c = signPad.getContext('2d'); c.lineTo(...pos(e)); c.stroke(); signed = true; });
  ['pointerup', 'pointercancel'].forEach(t => signPad.addEventListener(t, () => { drawing = false; }));
  document.getElementById('signClear').onclick = resetSign;
  resetSign();
})();

document.getElementById('submit').onclick = async () => {
  const btn = document.getElementById('submit');
  const msg = document.getElementById('msg');
  const sel = document.getElementById('code');
  if (!editing && !sel.value) { msg.textContent = '참여자를 선택해 주세요.'; return; }
  const noReason = [...document.querySelectorAll('.faceReason')].find(t => t.style.display !== 'none' && !t.value.trim());
  if (noReason) { msg.textContent = '"' + noReason.dataset.act + '"의 사유를 적어 주세요.'; noReason.focus(); return; }
  if (!signed) { msg.textContent = '서명을 해 주세요.'; return; }
  if (!document.getElementById('signAgree').checked) { msg.textContent = '"위 내용이 사실임을 확인합니다"에 체크해 주세요.'; return; }
  btn.disabled = true;
  // 제출은 10초 이상 걸릴 수 있어요: 경과 시간을 보여주고, 끝나기 전에 화면을 닫으려 하면 경고해요
  const t0 = Date.now();
  const tick = () => { msg.textContent = '제출하는 중이에요… ' + Math.round((Date.now() - t0) / 1000) + '초 (10~20초 걸릴 수 있어요. 화면을 닫거나 다시 누르지 말고 기다려 주세요)'; };
  tick(); const timer = setInterval(tick, 1000);
  const warnLeave = e => { e.preventDefault(); e.returnValue = ''; };
  window.addEventListener('beforeunload', warnLeave);
  const finish = () => { clearInterval(timer); window.removeEventListener('beforeunload', warnLeave); };
  const photoData = await fileToBase64(document.getElementById('facePhoto').files[0]);
  const form = {
    code: editing ? editing.code : sel.value, round: editing ? editing.round : document.getElementById('round').value,
    faceDate: document.getElementById('faceDate').value,
    faceDay: dayOf(document.getElementById('faceDate').value),
    faceTime: document.getElementById('faceTime').value,
    facePlace: document.getElementById('facePlace').value,
    faceTalk: document.getElementById('faceTalk').value,
    facePhotoData: photoData,
    faceNote: document.getElementById('faceNote').value,
    remote1Date: document.getElementById('remote1Date').value,
    remote1Day: dayOf(document.getElementById('remote1Date').value),
    remote1Time: document.getElementById('remote1Time').value,
    remote1How: document.getElementById('remote1How').value,
    remote1Talk: document.getElementById('remote1Talk').value,
    remote2Date: document.getElementById('remote2Date').value,
    remote2Day: dayOf(document.getElementById('remote2Date').value),
    remote2Time: document.getElementById('remote2Time').value,
    remote2How: document.getElementById('remote2How').value,
    remote2Talk: document.getElementById('remote2Talk').value,
    nextFace: document.getElementById('nextFace').value,
    nextRemote: document.getElementById('nextRemote').value,
    finalize: document.getElementById('finalize').checked,
    faceActs: [...document.querySelectorAll('.faceAct:checked')].map(cb => cb.value),
    faceActEtc: document.getElementById('faceActEtc').value.trim(),
    faceActReasons: Object.fromEntries([...document.querySelectorAll('.faceReason')].filter(t => t.style.display !== 'none').map(t => [t.dataset.act, t.value.trim()])),
    nextFaceDate: document.getElementById('nextFaceDate').value,
    nextFaceTime: document.getElementById('nextFaceTime').value,
    nextRemote1Date: document.getElementById('nextRemote1Date').value,
    nextRemote1Time: document.getElementById('nextRemote1Time').value,
    nextRemote2Date: document.getElementById('nextRemote2Date').value,
    nextRemote2Time: document.getElementById('nextRemote2Time').value,
    signData: trimSignData_()
  };
  SCALE_ITEMS.forEach(([key]) => {
    form[key] = scaleVals[key];
    form[key + '_근거'] = document.getElementById(key + '_evidence').value;
  });
  let res;
  try { res = await post({ action: editing ? 'editReport' : 'report', token, form }); }
  catch (err) {
    finish(); btn.disabled = false;
    msg.textContent = '연결이 끊겨 결과를 확인하지 못했어요. 다시 제출하기 전에 위의 "내 보고서 목록"에서 이미 제출됐는지 먼저 확인해 주세요.';
    return;
  }
  finish();
  if (res.ok) {
    post({ action: 'savePdf', token, code: form.code }).catch(() => {}); // PDF 보관은 응답 뒤에 따로(기다리지 않음)
    document.getElementById('app').style.display = 'none';
    const done = document.getElementById('done');
    done.style.display = 'block';
    if (res.notes && res.notes.length) done.innerHTML += '<br><br>' + res.notes.map(n => n.replace(/</g, '&lt;')).join('<br>');
  }
  else {
    msg.textContent = res.error === 'busy'
      ? '다른 제출을 처리하고 있어요. 1~2분 뒤에 다시 눌러 주세요. (이미 제출됐을 수 있으니 "내 보고서 목록"도 확인해 주세요)'
      : '제출하지 못했어요: ' + res.error;
    btn.disabled = false;
  }
};
