<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>위드워킹 관리자 화면</title>
<style>
  :root { --teal:#2C6765; --orange:#D68B47; --bg:#EDF1EC; --surface:#fff; --text:#1E2A2B; --muted:#5A6968; --border:#D2DAD3; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Apple SD Gothic Neo","Malgun Gothic",sans-serif; background: var(--bg); color: var(--text); }
  #app { display: flex; min-height: 100vh; }
  #side { width: 280px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #side header { padding: 14px; border-bottom: 1px solid var(--border); }
  #side header b { font-size: 15px; } #side header span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  #search { margin: 10px 12px 6px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 12.5px; }
  .sideSel { margin: 0 12px 6px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 12.5px; background: var(--bg); color: var(--text); width: calc(100% - 24px); }
  #dashBtn { margin: 0 12px 10px; padding: 9px; border: 0; border-radius: 8px; background: var(--teal); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  #list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .p-item { padding: 8px 9px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; font-size: 12.5px; }
  .p-item:hover { background: var(--bg); } .p-item.on { background: var(--teal); color: #fff; }
  .p-meta { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; } .p-item.on .p-meta { color: #D2E4E3; }
  #main { flex: 1; overflow-y: auto; padding: 26px 32px; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; min-width: 110px; }
  .card b { display: block; font-size: 22px; } .card span { font-size: 12px; color: var(--muted); }
  h2 { font-size: 16px; margin: 26px 0 10px; } h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  td, th { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; }
  th { background: var(--bg); color: var(--teal); font-size: 11.5px; }
  .msg { color: var(--muted); font-size: 13px; padding: 40px; text-align: center; }
  .m { font-size: 12.5px; color: var(--muted); }
  .report { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .report h3 { margin: 0 0 8px; font-size: 14px; } .report .m { margin: 2px 0; }
  .report a { color: var(--teal); }
  .scaleRow { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--bg); font-size: 12.5px; }
  .scaleRow:last-child { border-bottom: 0; }
  .lv { font-weight: 700; white-space: nowrap; }
  .lv1 { color: #C0392B; } .lv2 { color: #B9790F; } .lv3 { color: #2C6765; } .lv4 { color: #1E6B5C; }
  .evidence { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  details { margin-top: 10px; } summary { cursor: pointer; font-size: 12.5px; color: var(--teal); font-weight: 600; }
  .linkBtn { font: inherit; font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--teal); cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header><b>안전한더유스</b><span>위드워킹 관리자 화면</span></header>
    <input id="search" placeholder="이름·참여번호 검색">
    <select id="personFilter" class="sideSel"></select>
    <select id="bizFilter" class="sideSel"></select>
    <select id="yearFilter" class="sideSel"></select>
    <button id="dashBtn">대시보드</button>
    <div id="list"></div>
  </div>
  <div id="main"><div class="msg">불러오는 중...</div></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwj4uAvLD50QYSEvq2qV1zcz0ru-wQN33gxPKrMfh6QFF3UO9zH1SDOVH1ARbXt1xc/exec";
const params = new URLSearchParams(location.search);
const TOKEN = params.get("t") || "";
let DATA = null, activeCode = null;

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function fetchData() {
  // Apps Script가 가끔(한동안 쉬다가 첫 요청 등) 응답을 못 줘서 "Failed to fetch"가 나요 — 접속 실패일 때만 최대 3번 다시 시도
  let json;
  for (let attempt = 1; ; attempt++) {
    try { json = await (await fetch(SCRIPT_URL + "?action=adminOverview&token=" + encodeURIComponent(TOKEN))).json(); break; }
    catch (err) { if (attempt >= 3) throw err; await new Promise(r => setTimeout(r, 1500 * attempt)); }
  }
  if (!json.ok) throw new Error(json.error || "오류");
  DATA = json;
  renderFilters();
  renderList();
}

async function load() {
  if (!TOKEN) { document.getElementById("main").innerHTML = '<div class="msg">주소 끝에 ?t=관리자토큰 이 빠져 있어요.</div>'; return; }
  try { await fetchData(); renderDashboard(); }
  catch (err) { document.getElementById("main").innerHTML = '<div class="msg">불러오지 못했어요: ' + esc(err.message) + '</div>'; }
}

// 사이드바 드롭다운(담당 활동가·코치 / 사업 / 연도) — 실제 데이터에 있는 값만 골라 채워요.
const yearOf = p => (p.assignedAt || "").slice(0, 4);
function opt(v, label, cur) { return '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") + '>' + esc(label) + '</option>'; }
function renderFilters() {
  const keep = id => document.getElementById(id).value || "";
  const person = keep("personFilter"), year = keep("yearFilter");
  // 허브의 "미래내일일경험" 탭처럼 주소에 ?biz=가 붙어 오면 처음 한 번 그 사업으로 걸러서 열어요
  const biz = keep("bizFilter") || (INIT_BIZ_ && !initBizUsed_ ? INIT_BIZ_ : "");
  initBizUsed_ = true;
  // 2026-11-23: 모두 '동행활동가'(미래내일일경험 담당일 땐 동행코치로 불림) — 역할로 나누지 않고 이름만 나열해요
  document.getElementById("personFilter").innerHTML = opt("", "전체 동행활동가", person) + DATA.activists.map(a => opt(a.name, a.name, person)).join("") + opt("미배정", "미배정", person);
  const bizs = Array.from(new Set(DATA.participants.map(p => p.biz).filter(Boolean))).sort();
  document.getElementById("bizFilter").innerHTML = opt("", "전체 사업", biz) + bizs.map(b => opt(b, b, biz)).join("");
  const years = Array.from(new Set(DATA.participants.map(yearOf).filter(Boolean))).sort().reverse();
  document.getElementById("yearFilter").innerHTML = opt("", "전체 연도", year) + years.map(y => opt(y, y + "년", year)).join("");
}
function matches(p, q) {
  const person = document.getElementById("personFilter").value, biz = document.getElementById("bizFilter").value, year = document.getElementById("yearFilter").value;
  return (!q || p.name.indexOf(q) >= 0 || p.code.indexOf(q) >= 0) &&
    (!person || (person === "미배정" ? !p.activistName : p.activistName === person)) &&
    (!biz || p.biz === biz) && (!year || yearOf(p) === year);
}

function renderList() {
  const q = document.getElementById("search").value.trim();
  const rows = DATA.participants.filter(p => matches(p, q));
  document.getElementById("list").innerHTML = rows.map(p =>
    '<div class="p-item' + (p.code === activeCode ? " on" : "") + '" data-code="' + esc(p.code) + '">' +
      '<b>' + esc(p.code) + '</b> ' + esc(p.name) +
      '<span class="p-meta">' + esc(p.status) + (p.biz ? " · " + esc(p.biz) : "") + (p.activistName ? " · 활동가 " + esc(p.activistName) : " · 미배정") + " · 보고서 " + p.reportCount + "건" + '</span></div>'
  ).join("") || '<div class="msg">해당하는 참여자가 없어요.</div>';
  document.querySelectorAll(".p-item").forEach(el => el.addEventListener("click", () => {
    activeCode = el.dataset.code; renderList(); renderDetail(DATA.participants.find(p => p.code === activeCode));
  }));
}

// 그 사람이 맡은(맡았던) 참여자들의 사업 — 미래내일일경험이면 "동행코치"로 표시
function bizOfActivist(name) {
  const bizs = Array.from(new Set(DATA.participants.filter(p => p.activistName === name).map(p => p.biz).filter(Boolean)));
  return bizs.map(b => b === "미래내일일경험" ? b + "(동행코치)" : b).join(", ") || "—";
}
const INIT_BIZ_ = params.get("biz") || "";
let initBizUsed_ = false;

// 사업 요약(2026-11-23, 허브 "미래내일일경험" 탭용): 진행 회차·최근 제출·다음 일정·장기 미제출을 한눈에.
// shortcut: 14일 기준은 고정값 — 사업마다 다르게 보고 싶으면 STALE_DAYS_를 사업별로 나누면 돼요.
const STALE_DAYS_ = 14;
function bizSummaryHtml(biz) {
  const who = biz === "미래내일일경험" ? "동행코치" : "동행활동가";
  const ps = DATA.participants.filter(p => p.biz === biz);
  const ongoing = ps.filter(p => p.status !== "종료");
  const latest = {};
  DATA.reports.forEach(r => { if (!latest[r.code] || (r.writtenAt || "") > (latest[r.code].writtenAt || "")) latest[r.code] = r; });
  const daysSince = w => w ? Math.floor((Date.now() - new Date(w.replace(" ", "T") + ":00+09:00").getTime()) / 86400000) : null;
  const rows = ongoing.map(p => {
    const r = latest[p.code], d = r ? daysSince(r.writtenAt) : null;
    const next = r ? [r.nextFaceSched && "대면 " + r.nextFaceSched, r.nextRemoteSched && "비대면 " + r.nextRemoteSched].filter(Boolean).join(" / ") : "";
    return { p: p, r: r, d: d, next: next, noNext: !next, stale: d === null || d >= STALE_DAYS_ };
  }).sort((a, b) => (a.p.activistName || "").localeCompare(b.p.activistName || "") || a.p.name.localeCompare(b.p.name));
  let h = '<h2>' + esc(biz) + ' 요약</h2><div class="cards">' +
    '<div class="card"><b>' + ongoing.length + '</b><span>진행중 참여자</span></div>' +
    '<div class="card"><b>' + (ps.length - ongoing.length) + '</b><span>종결</span></div>' +
    '<div class="card"><b>' + rows.filter(x => x.noNext).length + '</b><span>다음 일정 없음</span></div>' +
    '<div class="card"><b>' + rows.filter(x => x.stale).length + '</b><span>' + STALE_DAYS_ + '일 이상 보고서 없음</span></div></div>';
  h += '<table><tr><th>' + who + '</th><th>참여자</th><th>진행</th><th>최근 제출</th><th>다음 일정</th><th>확인 필요</th></tr>' +
    rows.map(x => '<tr><td>' + esc(x.p.activistName || "미배정") + '</td><td>' + esc(x.p.name) + '</td><td>' + x.p.reportCount + ' / ' + esc(x.p.track) + '회</td>' +
      '<td>' + (x.r ? esc(x.r.writtenAt) + ' <span class="m">(' + x.d + '일 전)</span>' : '<span class="m">없음</span>') + '</td>' +
      '<td>' + (x.next ? esc(x.next) : '<span class="m">없음</span>') + '</td>' +
      '<td style="color:#C0392B">' + [x.noNext && "다음 일정 없음", x.stale && (x.r ? STALE_DAYS_ + "일 이상 미제출" : "보고서 없음")].filter(Boolean).join(", ") + '</td></tr>').join("") +
    '</table>';
  return h;
}

function renderDashboard() {
  activeCode = null; renderList();
  const bizSel = document.getElementById("bizFilter").value;
  const view = bizSel ? Object.assign({}, DATA, {
    participants: DATA.participants.filter(p => p.biz === bizSel),
    activists: DATA.activists.filter(a => DATA.participants.some(p => p.biz === bizSel && p.activistName === a.name))
  }) : DATA;
  const ongoing = view.participants.filter(p => p.status !== "종료").length;
  const ended = view.participants.length - ongoing;
  let h = '<div class="cards">' +
    '<div class="card"><b>' + view.activists.length + '</b><span>동행활동가</span></div>' +
    '<div class="card"><b>' + ongoing + '</b><span>진행중 참여자</span></div>' +
    '<div class="card"><b>' + ended + '</b><span>종료</span></div>' +
    '<div class="card"><b>' + DATA.reports.filter(r => view.participants.some(p => p.code === r.code)).length + '</b><span>누적 보고서</span></div></div>';
  if (bizSel) h = bizSummaryHtml(bizSel) + '<h2>전체 현황</h2>' + h;
  h += '<h2>동행활동가 (' + view.activists.length + '명)</h2><table><tr><th>담당 사업</th><th>이름</th><th>연락처</th><th>담당(진행중)</th><th>등록일</th><th>활동보고링크</th></tr>' +
    view.activists.map((a, i) => '<tr><td>' + esc(bizOfActivist(a.name)) + '</td><td>' + esc(a.name) + '</td><td>' + esc(a.phone) + '</td><td>' + a.activeCount + '명</td><td>' + esc(a.registeredAt) + '</td>' +
      '<td><button class="linkBtn" data-i="' + i + '">링크 복사</button> <span class="m linkMsg" data-i="' + i + '"></span></td></tr>').join("") +
    '</table>';
  h += '<h2>참여자 (' + view.participants.length + '명)</h2><table><tr><th>참여번호</th><th>이름</th><th>활동가</th><th>트랙</th><th>상태</th><th>배정일</th><th>보고서</th></tr>' +
    view.participants.map(p => '<tr><td>' + esc(p.code) + '</td><td>' + esc(p.name) + '</td><td>' + esc(p.activistName || "미배정") + '</td><td>' + esc(p.track || "15") + '회</td><td>' + esc(p.status) + '</td><td>' + esc(p.assignedAt) + '</td><td>' + p.reportCount + '건</td></tr>').join("") +
    '</table>';
  document.getElementById("main").innerHTML = h;
  document.querySelectorAll(".linkBtn").forEach(btn => btn.addEventListener("click", () => {
    const i = Number(btn.dataset.i);
    const a = view.activists[i];
    const link = "https://safeppl.github.io/maeum-salpigi/withwalking/?t=" + a.token;
    const msgEl = document.querySelector('.linkMsg[data-i="' + i + '"]');
    copyToClipboard_(link, msgEl);
  }));
}

// 클립보드 권한이 막힌 환경(예: 허브 페이지 iframe 안)에서도 최대한 복사되도록,
// navigator.clipboard가 안 되면 숨겨진 textarea + execCommand로 한 번 더 시도해요.
function copyToClipboard_(text, msgEl) {
  const ok = () => { msgEl.textContent = "복사되었습니다."; setTimeout(() => msgEl.textContent = "", 2500); };
  const fail = () => { msgEl.textContent = "자동 복사가 안 돼요 — 길게 눌러 직접 복사해주세요."; };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    document.body.removeChild(ta);
    done ? ok() : fail();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  } else {
    fallback();
  }
}

const SCALE_LEVELS_ = ["매우 그렇다", "그렇다", "그렇지 않다", "매우 그렇지 않다"];
function scaleRowHtml(s) {
  const idx = SCALE_LEVELS_.indexOf(s.level);
  const lv = idx >= 0 ? String(idx + 1) : "";
  return '<div class="scaleRow"><span>' + esc(s.q) + '</span><span class="lv lv' + lv + '">' + esc(s.level || "미응답") + '</span></div>' +
    (s.evidence ? '<p class="evidence">↳ ' + esc(s.evidence) + '</p>' : '');
}

function renderDetail(p) {
  if (!p) return;
  const reports = DATA.reports.filter(r => r.code === p.code);
  let h = '<p class="m"><b>' + esc(p.code) + ' · ' + esc(p.name) + '</b> · 활동가 ' + esc(p.activistName || "미배정") + ' · ' + esc(p.status) + '</p>';
  if (p.intakeUrl) h += '<p class="m"><a href="' + esc(p.intakeUrl) + '" target="_blank">초기면접지 보기</a></p>';
  if (!reports.length) { h += '<p class="msg">아직 제출된 보고서가 없어요.</p>'; document.getElementById("main").innerHTML = h; return; }
  const remoteLine = x => [x[0], x[1], x[2]].filter(Boolean).map(esc).join(" ") + (x[3] ? " (" + esc(x[3]) + ")" : "") + (x[4] ? " — " + esc(x[4]) : "");
  h += reports.map(r => {
    let c = '<div class="report"><h3>' + esc(r.round || "") + '회차 · ' + esc(r.writtenAt) + '</h3>';
    const faceLine = [r.faceDate, r.faceDay, r.faceTime].filter(Boolean).map(esc).join(" ");
    if (r.faceActs) c += '<p class="m"><b>대면 활동 내용</b> — ' + esc(r.faceActs) + '</p>';
    c += '<p class="m"><b>대면</b> — ' + (faceLine || "—") + (r.facePlace ? " · " + esc(r.facePlace) : "") + '</p><p>' + esc(r.faceTalk || "").replace(/\n/g, "<br>") + '</p>';
    if (r.facePhoto) c += '<p class="m"><a href="' + esc(r.facePhoto) + '" target="_blank">활동 사진 보기</a></p>';
    if (r.faceNote) c += '<p class="m">특이사항: ' + esc(r.faceNote) + '</p>';
    const remoteHtml = [r.remote1, r.remote2].filter(x => x[0] || x[4]).map(remoteLine).join("<br>");
    if (remoteHtml) c += '<p class="m"><b>비대면 연락</b></p><p>' + remoteHtml + '</p>';
    if (r.nextFace || r.nextRemote) c += '<p class="m"><b>다음 계획</b></p><p>' + esc(r.nextFace || "") + (r.nextRemote ? '<br>' + esc(r.nextRemote) : '') + '</p>';
    if (r.nextFaceSched || r.nextRemoteSched) c += '<p class="m"><b>다음 일정(스케줄표 등록)</b> — ' + [r.nextFaceSched && "대면 " + esc(r.nextFaceSched), r.nextRemoteSched && "비대면 " + esc(r.nextRemoteSched)].filter(Boolean).join(" · ") + '</p>';
    if (r.doc) c += '<p class="m"><a href="' + esc(r.doc) + '" target="_blank">제출용 문서 보기</a></p>';
    c += '<details><summary>참여자 반응 변화 체크(15문항) 보기</summary>' + r.scale.map(scaleRowHtml).join("") + '</details>';
    c += '</div>';
    return c;
  }).join("");
  document.getElementById("main").innerHTML = h;
}

document.getElementById("dashBtn").addEventListener("click", renderDashboard);
document.getElementById("search").addEventListener("input", renderList);
["personFilter", "bizFilter", "yearFilter"].forEach(id => document.getElementById(id).addEventListener("change", () => { if (activeCode === null) renderDashboard(); else renderList(); }));
load();
</script>
</body>
</html>
